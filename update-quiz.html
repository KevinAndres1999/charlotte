    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { margin: 20px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Actualizar Cuestionarios en Firebase</h1>
    <p>Este script actualiza todos los cuestionarios existentes agregando campos faltantes (tiempoLimite, numeroIntentos, totalPreguntas).</p>
    
    <button onclick="updateExistingQuizzes()">Actualizar Cuestionarios</button>
    
    <div id="status">Listo para actualizar...</div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, doc, updateDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        const firebaseConfig = window.FIREBASE_CONFIG;

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function updateExistingQuizzes() {
            try {
                document.getElementById('status').textContent = 'Buscando cuestionarios existentes...';
                document.getElementById('status').className = '';

                const querySnapshot = await getDocs(collection(db, 'cuestionarios'));
                const updates = [];
                let updatedCount = 0;

                querySnapshot.forEach((document) => {
                    const quizData = document.data();
                    const updateData = {};

                    // Agregar campos faltantes si no existen
                    if (!quizData.hasOwnProperty('tiempoLimite') || quizData.tiempoLimite === null) {
                        updateData.tiempoLimite = 60; // 60 minutos por defecto
                    }
                    if (!quizData.hasOwnProperty('numeroIntentos') || quizData.numeroIntentos === null) {
                        updateData.numeroIntentos = 1; // 1 intento por defecto
                    }
                    if (!quizData.hasOwnProperty('totalPreguntas') || quizData.totalPreguntas === null) {
                        updateData.totalPreguntas = quizData.preguntas ? quizData.preguntas.length : 0;
                    }

                    if (Object.keys(updateData).length > 0) {
                        updates.push({
                            docRef: doc(db, 'cuestionarios', document.id),
                            updateData: updateData
                        });
                    }
                });

                document.getElementById('status').textContent = `Encontrados ${updates.length} cuestionarios para actualizar...`;

                // Actualizar cada documento
                for (const update of updates) {
                    await updateDoc(update.docRef, update.updateData);
                    updatedCount++;
                    document.getElementById('status').textContent = `Actualizando... ${updatedCount}/${updates.length}`;
                }

                document.getElementById('status').textContent = `¡Actualización completada! Se actualizaron ${updatedCount} cuestionarios.`;
                document.getElementById('status').className = 'success';

            } catch (error) {
                console.error('Error updating quizzes:', error);
                document.getElementById('status').textContent = `Error: ${error.message}`;
                document.getElementById('status').className = 'error';
            }
        }

        // Hacer la función global para el botón
        window.updateExistingQuizzes = updateExistingQuizzes;
    </script>
</body>
</html>
