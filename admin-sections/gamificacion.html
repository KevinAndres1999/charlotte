    <div id="gamificacion" class="content-section">
        <div class="quiz-builder-section">
            <div class="quiz-builder-header" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; border-radius: 12px 12px 0 0;">
                <h3><i class="fas fa-trophy"></i> Sistema de Gamificación</h3>
                <p style="color: white;">Gestiona puntos, logros y leaderboard de estudiantes</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <h3 class="stat-value" id="totalPuntos">0</h3>
                            <p class="stat-label">Puntos Totales Otorgados</p>
                        </div>
                        <div class="stat-card-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);"><i class="fas fa-star"></i></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <h3 class="stat-value" id="topEstudiante">-</h3>
                            <p class="stat-label">Estudiante Líder</p>
                        </div>
                        <div class="stat-card-icon" style="background: linear-gradient(135deg, #10b981, #059669);"><i class="fas fa-trophy"></i></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h4><i class="fas fa-cog"></i> Configuración de Puntos</h4>
                <div class="form-group">
                    <label>Puntos por clase completada</label>
                    <input type="number" id="puntosClase" value="10" min="0">
                </div>
                <div class="form-group">
                    <label>Puntos por actividad completada</label>
                    <input type="number" id="puntosActividad" value="20" min="0">
                </div>
                <div class="form-group">
                    <label>Puntos por cuestionario completado</label>
                    <input type="number" id="puntosCuestionario" value="25" min="0">
                </div>
                <button class="btn btn-primary" onclick="guardarConfiguracionPuntos()">
                    <i class="fas fa-save"></i> Guardar Configuración
                </button>
            </div>

            <div class="card">
                <h4><i class="fas fa-trophy"></i> Leaderboard</h4>
                <div id="leaderboardList"></div>
            </div>
        </div>
    </div>
