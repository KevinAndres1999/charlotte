            <div id="videos" class="content-section">
                <div class="quiz-builder-section">
                    <div class="quiz-builder-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; border-radius: 12px 12px 0 0;">
                        <h3><i class="fas fa-video"></i> Gestión de Videos</h3>
                        <p style="color: white;">Sube y administra videos educativos para tus estudiantes</p>
                    </div>

                    <form id="videoForm">
                        <div class="quiz-form-grid">
                            <div class="quiz-form-card">
                                <h4><i class="fas fa-info-circle"></i> Información del Video</h4>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label for="videoTitle">Título del Video</label>
                                    <input type="text" id="videoTitle" placeholder="Ej: Técnicas de Corte Avanzado" required>
                                </div>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label for="videoDesc">Descripción</label>
                                    <textarea id="videoDesc" placeholder="Describe el contenido y objetivos del video..."></textarea>
                                </div>
                            </div>

                            <div class="quiz-form-card">
                                <h4><i class="fas fa-cogs"></i> Configuración</h4>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label for="videoPrograma">Programa</label>
                                    <select id="videoPrograma" required onchange="populateModuloSelect('videoModulo', 'videoPrograma')">
                                        <option value="">Seleccionar programa</option>
                                        <option value="Belleza Integral">Belleza Integral</option>
                                        <option value="Panadería y Pastelería">Panadería y Pastelería</option>
                                        <option value="Asesoría Técnica">Asesoría Técnica</option>
                                    </select>
                                </div>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label>Horarios (selecciona uno o más)</label>
                                    <div class="horarios-checkboxes" style="display: flex; flex-direction: column; gap: 8px;">
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoHorarios" value="Sábado Matutina">
                                            Sábado Matutina
                                        </label>
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoHorarios" value="Sábado Vespertina">
                                            Sábado Vespertina
                                        </label>
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoHorarios" value="Domingo Matutina">
                                            Domingo Matutina
                                        </label>
                                    </div>
                                </div>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label>Sedes (selecciona una o más)</label>
                                    <div class="sedes-checkboxes" style="display: flex; flex-direction: column; gap: 8px;">
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoSedes" value="Carapungo">
                                            Carapungo
                                        </label>
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoSedes" value="Sangolquí">
                                            Sangolquí
                                        </label>
                                    </div>
                                </div>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label for="videoUrl">URL del Video</label>
                                    <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=..." required>
                                </div>
                            </div>
                        </div>

                        <div class="submit-section">
                            <button type="submit" class="btn-submit-quiz">
                                <i class="fas fa-upload"></i> Subir Video
                            </button>
                        </div>
                    </form>
                </div>

                <div class="quiz-builder-section">
                    <div class="quiz-builder-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; border-radius: 12px 12px 0 0;">
                        <h3><i class="fas fa-list"></i> Videos Subidos</h3>
                        <p style="color: white;">Gestiona y administra tus videos publicados</p>
                    </div>
                    <div id="videosList" class="grid"></div>
                </div>
            </div>
