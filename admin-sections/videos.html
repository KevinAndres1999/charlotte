            <div id="videos" class="content-section">
                <div class="quiz-builder-section">
                    <div class="quiz-builder-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; border-radius: 12px 12px 0 0;">
                        <h3><i class="fas fa-video"></i> Gestión de Videos</h3>
                        <p style="color: white;">Sube y administra videos educativos para tus estudiantes</p>
                    </div>

                    <form id="videoForm">
                        <div class="quiz-form-grid">
                            <div class="quiz-form-card">
                                <h4><i class="fas fa-info-circle"></i> Información del Video</h4>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label for="videoTitle">Título del Video</label>
                                    <input type="text" id="videoTitle" placeholder="Ej: Técnicas de Corte Avanzado" required>
                                </div>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label for="videoDesc">Descripción</label>
                                    <textarea id="videoDesc" placeholder="Describe el contenido y objetivos del video..."></textarea>
                                </div>
                            </div>

                            <div class="quiz-form-card">
                                <h4><i class="fas fa-cogs"></i> Configuración</h4>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label for="videoPrograma">Programa</label>
                                    <select id="videoPrograma" required onchange="populateModuloSelect('videoModulo', 'videoPrograma')">
                                        <option value="">Seleccionar programa</option>
                                        <option value="Belleza Integral">Belleza Integral</option>
                                        <option value="Panadería y Pastelería">Panadería y Pastelería</option>
                                        <option value="Asesoría Técnica">Asesoría Técnica</option>
                                    </select>
                                </div>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label>Horarios (selecciona uno o más)</label>
                                    <div class="horarios-checkboxes" style="display: flex; flex-direction: column; gap: 8px;">
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoHorarios" value="Sábado Matutina">
                                            Sábado Matutina
                                        </label>
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoHorarios" value="Sábado Vespertina">
                                            Sábado Vespertina
                                        </label>
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoHorarios" value="Domingo Matutina">
                                            Domingo Matutina
                                        </label>
                                    </div>
                                </div>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label>Sedes (selecciona una o más)</label>
                                    <div class="sedes-checkboxes" style="display: flex; flex-direction: column; gap: 8px;">
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoSedes" value="Carapungo">
                                            Carapungo
                                        </label>
                                        <label style="display: flex; align-items: center; gap: 8px;">
                                            <input type="checkbox" name="videoSedes" value="Sangolquí">
                                            Sangolquí
                                        </label>
                                    </div>
                                </div>
                                <div class="form-group" style="border: 1px solid #e2e8f0; padding: 10px; margin-bottom: 10px; border-radius: 8px;">
                                    <label for="videoUrl">URL del Video</label>
                                    <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=..." required>
                                </div>
                            </div>
                        </div>

                        <div class="submit-section">
                            <button type="submit" class="btn-submit-quiz">
                                <i class="fas fa-upload"></i> Subir Video
                            </button>
                        </div>
                    </form>
                </div>

                <div class="quiz-builder-section">
                    <div class="quiz-builder-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; border-radius: 12px 12px 0 0;">
                        <h3><i class="fas fa-list"></i> Videos Subidos</h3>
                        <p style="color: white;">Gestiona y administra tus videos publicados</p>
                    </div>
                    <div id="videosList" class="grid"></div>
                </div>
            </div>

            <script>
                // Función para subir video
                async function submitVideo() {
                    try {
                        const title = document.getElementById('videoTitle').value;
                        const description = document.getElementById('videoDesc').value;
                        const programa = document.getElementById('videoPrograma').value;
                        const modulo = document.getElementById('videoModulo').value;
                        const url = document.getElementById('videoUrl').value;
                        
                        // Obtener horarios seleccionados
                        const horariosCheckboxes = document.querySelectorAll('input[name="videoHorarios"]:checked');
                        const horarios = Array.from(horariosCheckboxes).map(cb => cb.value);
                        
                        if (!title || !programa || !url) {
                            alert('Por favor completa todos los campos obligatorios');
                            return;
                        }
                        
                        const videoData = {
                            title,
                            description,
                            programa,
                            modulo,
                            url,
                            horarios,
                            createdAt: new Date(),
                            active: true
                        };
                        
                        await window.db.collection('videos').add(videoData);
                        
                        alert('Video subido exitosamente');
                        document.getElementById('videoForm').reset();
                        loadVideosList();
                        
                    } catch (error) {
                        console.error('Error uploading video:', error);
                        alert('Error al subir video');
                    }
                }

                // Función para cargar lista de videos
                async function loadVideosList() {
                    try {
                        console.log('Loading videos list...');
                        const snapshot = await window.db.collection('videos').orderBy('createdAt', 'desc').get();
                        
                        const container = document.getElementById('videosList');
                        
                        if (snapshot.empty) {
                            container.innerHTML = '<div style="text-align: center; padding: 3rem; color: #6b7280;"><i class="fas fa-video fa-3x" style="margin-bottom: 1rem; opacity: 0.5;"></i><p>No hay videos subidos</p></div>';
                            return;
                        }
                        
                        let html = '';
                        snapshot.forEach(doc => {
                            const video = doc.data();
                            html += `
                                <div style="background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                                        <div style="flex: 1;">
                                            <h4 style="margin: 0 0 0.5rem 0; color: #1f2937;">${video.title}</h4>
                                            <p style="margin: 0 0 0.5rem 0; color: #6b7280; font-size: 0.9rem;">${video.description || 'Sin descripción'}</p>
                                            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                                                <span style="background: #e0e7ff; color: #3730a3; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem;">${video.programa}</span>
                                                ${video.modulo ? `<span style="background: #f3e8ff; color: #6b21a8; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem;">${video.modulo}</span>` : ''}
                                                ${video.horarios ? video.horarios.map(h => `<span style="background: #fef3c7; color: #92400e; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem;">${h}</span>`).join('') : ''}
                                            </div>
                                        </div>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <button onclick="editVideo('${doc.id}')" style="padding: 0.5rem; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button onclick="deleteVideo('${doc.id}')" style="padding: 0.5rem; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer;">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0;">
                                        <p style="margin: 0; color: #374151; font-family: monospace; font-size: 0.9rem; word-break: break-all;">${video.url}</p>
                                    </div>
                                </div>
                            `;
                        });
                        
                        container.innerHTML = html;
                    } catch (error) {
                        console.error('Error loading videos:', error);
                        document.getElementById('videosList').innerHTML = '<div style="text-align: center; padding: 3rem; color: #ef4444;"><i class="fas fa-exclamation-triangle fa-3x"></i><p>Error al cargar videos</p></div>';
                    }
                }

                // Función para editar video
                async function editVideo(videoId) {
                    // Implementar edición de video
                    alert('Función de edición próximamente disponible');
                }

                // Función para eliminar video
                async function deleteVideo(videoId) {
                    if (confirm('¿Estás seguro de que quieres eliminar este video?')) {
                        try {
                            await window.db.collection('videos').doc(videoId).delete();
                            alert('Video eliminado exitosamente');
                            loadVideosList();
                        } catch (error) {
                            console.error('Error deleting video:', error);
                            alert('Error al eliminar video');
                        }
                    }
                }

                // Función para poblar select de módulos basado en programa
                function populateModuloSelect(moduloSelectId, programaSelectId) {
                    const programaSelect = document.getElementById(programaSelectId);
                    const moduloSelect = document.getElementById(moduloSelectId);
                    
                    if (!programaSelect || !moduloSelect) return;
                    
                    const programa = programaSelect.value;
                    moduloSelect.innerHTML = '<option value="">Seleccionar módulo</option>';
                    
                    const modulos = {
                        'Belleza Integral': [
                            'Módulo 1: Diseño de Mirada',
                            'Módulo 2: Maquillaje',
                            'Módulo 3: Estilismo',
                            'Módulo 4: Nails Designer'
                        ],
                        'Panadería y Pastelería': [
                            'Módulo 1: Panadería',
                            'Módulo 2: Galletaría',
                            'Módulo 3: Pastelería',
                            'Módulo 4: Repostería'
                        ],
                        'Asesoría Técnica': [
                            'Módulo 1: Fundamentos',
                            'Módulo 2: Estrategias',
                            'Módulo 3: Gestión',
                            'Módulo 4: Especialización'
                        ]
                    };
                    
                    if (modulos[programa]) {
                        modulos[programa].forEach(modulo => {
                            const option = document.createElement('option');
                            option.value = modulo;
                            option.textContent = modulo;
                            moduloSelect.appendChild(option);
                        });
                    }
                }

                // Cargar datos iniciales cuando se carga la sección
                document.addEventListener('DOMContentLoaded', function() {
                    // Pequeño delay para asegurar que Firebase esté inicializado
                    setTimeout(() => {
                        loadVideosList();
                    }, 100);
                });

                // También exponer la función globalmente para que admin.html pueda llamarla
                window.loadVideosList = loadVideosList;
            </script>
        </div>
