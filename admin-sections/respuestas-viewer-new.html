            <div id="respuestas-viewer" class="content-section">
                <!-- Panel de Estadísticas -->
                <div class="quiz-builder-section">
                    <div class="quiz-builder-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; border-radius: 12px 12px 0 0;">
                        <h3><i class="fas fa-clipboard-list"></i> Respuestas de Cuestionarios y Evaluaciones</h3>
                        <p style="color: white;">Revisa y califica las respuestas de tus estudiantes</p>
                    </div>

                    <!-- Estadísticas -->
                    <div class="stats-grid" style="margin-bottom: 32px;">
                        <div class="stat-card">
                            <div class="stat-card-header">
                                <div>
                                    <h3 class="stat-value" id="total-respuestas">0</h3>
                                    <p class="stat-label">Total Respuestas</p>
                                </div>
                                <div class="stat-card-icon blue"><i class="fas fa-clipboard-list"></i></div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-header">
                                <div>
                                    <h3 class="stat-value" id="pendientes-respuestas">0</h3>
                                    <p class="stat-label">Pendientes</p>
                                </div>
                                <div class="stat-card-icon yellow"><i class="fas fa-clock"></i></div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-header">
                                <div>
                                    <h3 class="stat-value" id="calificadas-respuestas">0</h3>
                                    <p class="stat-label">Calificadas</p>
                                </div>
                                <div class="stat-card-icon green"><i class="fas fa-check-circle"></i></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Grid de Cuestionarios/Evaluaciones -->
                <div id="cuestionariosGrid" class="quiz-builder-section" style="display: block;">
                    <div class="quiz-builder-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; border-radius: 12px 12px 0 0;">
                        <h3><i class="fas fa-question-circle"></i> Cuestionarios y Evaluaciones</h3>
                        <p style="color: white;">Haz clic en un cuestionario/evaluación para ver las respuestas de estudiantes</p>
                    </div>
                    <div class="clase-content-grid" style="grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; margin-top: 2rem;">
                        <!-- Los cuestionarios/evaluaciones se cargarán aquí -->
                    </div>
                </div>

                <!-- Contenedor de Respuestas -->
                <div id="respuestasContainer" class="quiz-builder-section" style="display: none;">
                    <div class="quiz-builder-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; border-radius: 12px 12px 0 0;">
                        <h3><i class="fas fa-clipboard-list"></i> Respuestas de <span id="quizTitle"></span></h3>
                        <p style="color: white;">Tipo: <span id="quizType"></span></p>
                        <button onclick="volverCuestionarios()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; cursor: pointer;">
                            <i class="fas fa-arrow-left"></i> Volver a Cuestionarios
                        </button>
                    </div>
                    
                    <div id="respuestasList" class="clase-content-grid" style="grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem;">
                        <!-- Las respuestas se cargarán aquí -->
                    </div>
                </div>
            </div>

            <script>
                let currentQuizId = null;
                let currentQuizType = null; // 'cuestionario' o 'evaluacion'

                // Función para cargar estadísticas de respuestas
                async function loadRespuestasStats() {
                    try {
                        // Contar respuestas de cuestionarios
                        const respuestasCuestionariosSnap = await window.db.collection('respuestasCuestionarios').get();
                        
                        // Contar respuestas de evaluaciones
                        const respuestasEvaluacionesSnap = await window.db.collection('respuestasEvaluaciones').get();
                        
                        const totalRespuestas = respuestasCuestionariosSnap.size + respuestasEvaluacionesSnap.size;
                        
                        let pendientes = 0;
                        let calificadas = 0;
                        
                        // Revisar cuestionarios
                        respuestasCuestionariosSnap.forEach(doc => {
                            const respuesta = doc.data();
                            if (respuesta.calificacion !== undefined && respuesta.calificacion !== null) {
                                calificadas++;
                            } else {
                                pendientes++;
                            }
                        });
                        
                        // Revisar evaluaciones
                        respuestasEvaluacionesSnap.forEach(doc => {
                            const respuesta = doc.data();
                            if (respuesta.calificacion !== undefined && respuesta.calificacion !== null) {
                                calificadas++;
                            } else {
                                pendientes++;
                            }
                        });
                        
                        document.getElementById('total-respuestas').textContent = totalRespuestas;
                        document.getElementById('pendientes-respuestas').textContent = pendientes;
                        document.getElementById('calificadas-respuestas').textContent = calificadas;
                        
                    } catch (error) {
                        console.error('Error loading respuestas stats:', error);
                    }
                }

                // Función para cargar cuestionarios y evaluaciones disponibles
                async function loadCuestionariosDisponibles() {
                    try {
                        const container = document.querySelector('#cuestionariosGrid .clase-content-grid');
                        
                        // Cargar cuestionarios
                        const cuestionariosSnap = await window.db.collection('cuestionarios').orderBy('createdAt', 'desc').get();
                        
                        // Cargar evaluaciones
                        const evaluacionesSnap = await window.db.collection('evaluaciones').orderBy('createdAt', 'desc').get();
                        
                        let html = '';
                        
                        // Agregar cuestionarios
                        cuestionariosSnap.forEach(doc => {
                            const cuestionario = doc.data();
                            html += `
                                <div class="content-card" onclick="verRespuestasCuestionario('${doc.id}', 'cuestionario')" style="cursor: pointer;">
                                    <div class="card-header">
                                        <h4>${cuestionario.titulo}</h4>
                                        <div class="card-meta">
                                            <span class="meta-item"><i class="fas fa-question-circle"></i> Cuestionario</span>
                                            <span class="meta-item"><i class="fas fa-graduation-cap"></i> ${cuestionario.programa || 'General'}</span>
                                        </div>
                                    </div>
                                    <div class="card-content">
                                        <p>${cuestionario.descripcion ? cuestionario.descripcion.substring(0, 100) + '...' : 'Cuestionario sin descripción'}</p>
                                        <div class="card-tags">
                                            <span class="tag tag-blue">Cuestionario</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        
                        // Agregar evaluaciones
                        evaluacionesSnap.forEach(doc => {
                            const evaluacion = doc.data();
                            html += `
                                <div class="content-card" onclick="verRespuestasCuestionario('${doc.id}', 'evaluacion')" style="cursor: pointer;">
                                    <div class="card-header">
                                        <h4>${evaluacion.titulo}</h4>
                                        <div class="card-meta">
                                            <span class="meta-item"><i class="fas fa-clipboard-check"></i> Evaluación</span>
                                            <span class="meta-item"><i class="fas fa-graduation-cap"></i> ${evaluacion.programa || 'General'}</span>
                                        </div>
                                    </div>
                                    <div class="card-content">
                                        <p>${evaluacion.descripcion ? evaluacion.descripcion.substring(0, 100) + '...' : 'Evaluación sin descripción'}</p>
                                        <div class="card-tags">
                                            <span class="tag tag-green">Evaluación</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        
                        if (html === '') {
                            container.innerHTML = '<div style="text-align: center; padding: 3rem; color: #6b7280;"><i class="fas fa-question-circle fa-3x" style="margin-bottom: 1rem; opacity: 0.5;"></i><p>No hay cuestionarios ni evaluaciones disponibles</p></div>';
                        } else {
                            container.innerHTML = html;
                        }
                        
                    } catch (error) {
                        console.error('Error loading cuestionarios:', error);
                        document.querySelector('#cuestionariosGrid .clase-content-grid').innerHTML = '<div style="text-align: center; padding: 3rem; color: #ef4444;"><i class="fas fa-exclamation-triangle fa-3x"></i><p>Error al cargar cuestionarios y evaluaciones</p></div>';
                    }
                }

                // Función para ver respuestas de un cuestionario/evaluación específico
                async function verRespuestasCuestionario(quizId, quizType) {
                    try {
                        currentQuizId = quizId;
                        currentQuizType = quizType;
                        
                        // Ocultar grid de cuestionarios y mostrar respuestas
                        document.getElementById('cuestionariosGrid').style.display = 'none';
                        document.getElementById('respuestasContainer').style.display = 'block';
                        
                        // Obtener información del cuestionario/evaluación
                        const collection = quizType === 'cuestionario' ? 'cuestionarios' : 'evaluaciones';
                        const quizDoc = await window.db.collection(collection).doc(quizId).get();
                        const quiz = quizDoc.data();
                        
                        document.getElementById('quizTitle').textContent = quiz.titulo;
                        document.getElementById('quizType').textContent = quizType === 'cuestionario' ? 'Cuestionario' : 'Evaluación';
                        
                        // Cargar respuestas
                        await loadRespuestasQuiz(quizId, quizType);
                        
                    } catch (error) {
                        console.error('Error loading quiz respuestas:', error);
                        alert('Error al cargar respuestas del cuestionario/evaluación');
                    }
                }

                // Función para cargar respuestas de un cuestionario/evaluación específico
                async function loadRespuestasQuiz(quizId, quizType) {
                    try {
                        const collection = quizType === 'cuestionario' ? 'respuestasCuestionarios' : 'respuestasEvaluaciones';
                        const respuestasSnap = await window.db.collection(collection).where('quizId', '==', quizId).get();
                        
                        const container = document.getElementById('respuestasList');
                        
                        if (respuestasSnap.empty) {
                            container.innerHTML = '<div style="text-align: center; padding: 3rem; color: #6b7280;"><i class="fas fa-clipboard-list fa-3x" style="margin-bottom: 1rem; opacity: 0.5;"></i><p>No hay respuestas para este cuestionario/evaluación</p></div>';
                            return;
                        }
                        
                        let html = '';
                        for (const doc of respuestasSnap.docs) {
                            const respuesta = doc.data();
                            
                            // Obtener información del estudiante
                            const userDoc = await window.db.collection('users').doc(respuesta.userId).get();
                            const user = userDoc.data();
                            
                            const statusColor = respuesta.calificacion !== undefined && respuesta.calificacion !== null ? '#10b981' : '#f59e0b';
                            const statusText = respuesta.calificacion !== undefined && respuesta.calificacion !== null ? 'Calificada' : 'Pendiente';
                            
                            html += `
                                <div class="content-card">
                                    <div class="card-header">
                                        <h4>${user ? user.name : 'Usuario desconocido'}</h4>
                                        <div class="card-meta">
                                            <span class="meta-item"><i class="fas fa-envelope"></i> ${user ? user.email : 'Sin email'}</span>
                                            <span class="meta-item"><i class="fas fa-calendar"></i> ${respuesta.fechaRespuesta ? new Date(respuesta.fechaRespuesta.toDate()).toLocaleDateString() : 'Fecha no disponible'}</span>
                                            <span class="meta-item" style="color: ${statusColor};"><i class="fas fa-circle"></i> ${statusText}</span>
                                        </div>
                                    </div>
                                    <div class="card-content">
                                        ${respuesta.respuestas ? `
                                            <div style="margin-bottom: 1rem;">
                                                <h5>Respuestas del estudiante:</h5>
                                                <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0;">
                                                    ${Object.entries(respuesta.respuestas).map(([preguntaId, respuestaTexto]) => 
                                                        `<p><strong>Pregunta ${preguntaId}:</strong> ${respuestaTexto}</p>`
                                                    ).join('')}
                                                </div>
                                            </div>
                                        ` : ''}
                                        
                                        ${respuesta.calificacion !== undefined && respuesta.calificacion !== null ? `
                                            <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 1rem; margin-top: 1rem;">
                                                <h5 style="margin: 0 0 0.5rem 0; color: #166534;">Calificación: ${respuesta.calificacion}/10</h5>
                                                ${respuesta.comentarios ? `<p style="margin: 0; color: #166534;"><strong>Comentarios:</strong> ${respuesta.comentarios}</p>` : ''}
                                            </div>
                                        ` : `
                                            <div style="background: #fefce8; border: 1px solid #fde68a; border-radius: 8px; padding: 1rem; margin-top: 1rem;">
                                                <h5 style="margin: 0 0 1rem 0; color: #92400e;">Calificar Respuesta</h5>
                                                <form onsubmit="calificarRespuesta(event, '${doc.id}', '${quizType}')">
                                                    <div style="margin-bottom: 1rem;">
                                                        <label style="display: block; margin-bottom: 0.5rem; color: #92400e; font-weight: 500;">Calificación (0-10):</label>
                                                        <input type="number" name="calificacion" min="0" max="10" step="0.1" required style="width: 100%; padding: 0.5rem; border: 1px solid #d97706; border-radius: 6px;">
                                                    </div>
                                                    <div style="margin-bottom: 1rem;">
                                                        <label style="display: block; margin-bottom: 0.5rem; color: #92400e; font-weight: 500;">Comentarios:</label>
                                                        <textarea name="comentarios" rows="3" style="width: 100%; padding: 0.5rem; border: 1px solid #d97706; border-radius: 6px;"></textarea>
                                                    </div>
                                                    <button type="submit" style="padding: 0.5rem 1rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;">
                                                        <i class="fas fa-check"></i> Calificar
                                                    </button>
                                                </form>
                                            </div>
                                        `}
                                    </div>
                                </div>
                            `;
                        }
                        
                        container.innerHTML = html;
                    } catch (error) {
                        console.error('Error loading respuestas:', error);
                        document.getElementById('respuestasList').innerHTML = '<div style="text-align: center; padding: 3rem; color: #ef4444;"><i class="fas fa-exclamation-triangle fa-3x"></i><p>Error al cargar respuestas</p></div>';
                    }
                }

                // Función para calificar una respuesta
                async function calificarRespuesta(event, respuestaId, quizType) {
                    event.preventDefault();
                    
                    try {
                        const formData = new FormData(event.target);
                        const calificacion = parseFloat(formData.get('calificacion'));
                        const comentarios = formData.get('comentarios');
                        
                        if (calificacion < 0 || calificacion > 10) {
                            alert('La calificación debe estar entre 0 y 10');
                            return;
                        }
                        
                        const collection = quizType === 'cuestionario' ? 'respuestasCuestionarios' : 'respuestasEvaluaciones';
                        
                        await window.db.collection(collection).doc(respuestaId).update({
                            calificacion,
                            comentarios,
                            fechaCalificacion: new Date(),
                            calificadoPor: 'admin'
                        });
                        
                        alert('Respuesta calificada exitosamente');
                        await loadRespuestasQuiz(currentQuizId, currentQuizType);
                        await loadRespuestasStats();
                        
                    } catch (error) {
                        console.error('Error calificando respuesta:', error);
                        alert('Error al calificar la respuesta');
                    }
                }

                // Función para volver al listado de cuestionarios
                function volverCuestionarios() {
                    document.getElementById('cuestionariosGrid').style.display = 'block';
                    document.getElementById('respuestasContainer').style.display = 'none';
                    currentQuizId = null;
                    currentQuizType = null;
                }

                // Función para enviar mensaje a estudiante
                function enviarMensaje(userId) {
                    // Implementar funcionalidad de mensajería
                    alert('Función de mensajería próximamente disponible');
                }

                // Cargar datos iniciales
                document.addEventListener('DOMContentLoaded', function() {
                    loadRespuestasStats();
                    loadCuestionariosDisponibles();
                });
            </script>
        </div>
