<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Charlotte</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>/* minimal inline styles preserved from login.html */</style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="hero-charlotte.png" alt="Charlotte Logo">
        <h1>Acceso al Sistema</h1>
      </div>
      <div id="message" class="message"></div>
      <form id="loginForm">
        <label>Correo</label>
        <input id="email" type="email" required />
        <label>Contraseña</label>
        <input id="password" type="password" required />
        <button type="submit">Entrar</button>
      </form>
      <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCBpoxr8yhAfCVqP00b6DKtMA0JWljlMMA",
      authDomain: "charlotte-babda.firebaseapp.com",
      projectId: "charlotte-babda",
      storageBucket: "charlotte-babda.firebasestorage.app",
      messagingSenderId: "486360806502",
      appId: "1:486360806502:web:d82fb7f351b8fe4587a9a7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Persiste la sesión en el navegador
    try { await setPersistence(auth, browserLocalPersistence); } catch(e){ console.warn('No se pudo setear persistencia', e); }
    const db = getFirestore(app);

    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    function showMessage(text, type){ messageDiv.textContent = text; messageDiv.className = `message ${type}`; messageDiv.style.display = 'block'; }

    loginForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if(!email || !password){ showMessage('Introduce email y contraseña', 'error'); return; }
      try{
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Intentar leer perfil desde users/{uid}
        let userDoc = await getDoc(doc(db, 'users', user.uid)).catch(()=>null);
        if(!userDoc || !userDoc.exists()){
          // Fallback: buscar en approvedStudents por email
          const q = query(collection(db, 'approvedStudents'), where('email', '==', email));
          const snap = await getDocs(q);
          if(!snap.empty){
            const data = snap.docs[0].data();
            // redirigir si aprobado
            if(data.status === 'approved') { window.location.href = 'dashboard.html'; return; }
            showMessage('Cuenta pendiente de aprobación', 'error'); return;
          }
          showMessage('Perfil no encontrado en la base de datos', 'error');
          return;
        }

        const userData = userDoc.data();
        const currentUser = {
          uid: user.uid,
          email: user.email,
          name: userData.name || '',
          role: userData.role,
          status: userData.status
        };
        sessionStorage.setItem('currentUser', JSON.stringify(currentUser));

        if(userData.role === 'teacher'){
          if(userData.status === 'approved') { window.location.href = 'admin.html'; return; }
          showMessage('Cuenta docente no aprobada', 'error'); return;
        }
        if(userData.role === 'student'){
          if(userData.status === 'approved') { window.location.href = 'dashboard.html'; return; }
          showMessage('Cuenta pendiente de aprobación', 'error'); return;
        }
        showMessage('Rol no reconocido', 'error');
      } catch (err){
        console.error('Login error', err);
        const code = err && err.code ? err.code : '';
        if(code === 'auth/wrong-password') showMessage('Contraseña incorrecta', 'error');
        else if(code === 'auth/user-not-found') showMessage('Usuario no encontrado, regístrate', 'error');
        else showMessage('Error al iniciar sesión. Revisa credenciales.', 'error');
      }
    });
  </script>
</body>
</html>
