headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[functions]

  [functions."*"]

[build]
publish = "."
publishOrigin = "config"
commandOrigin = "config"
command = "echo 'No build step required'"

  [build.environment]
  NODE_VERSION = "18"

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "*.html"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Pragma = "no-cache"
  Expires = "0"

[[headers]]
for = "*.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Pragma = "no-cache"
  Expires = "0"
  X-Content-Type-Options = "nosniff"

[[headers]]
for = "*.css"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Pragma = "no-cache"
  Expires = "0"

[[headers]]
for = "/sw.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Service-Worker-Allowed = "/"

[[headers]]
for = "/manifest.json"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Content-Type = "application/manifest+json"

[[headers]]
for = "/pwa.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  X-Content-Type-Options = "nosniff"

[[redirects]]
from = "/api/*"
to = "https://api.example.com/:splat"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]