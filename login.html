<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta http-equiv="Permissions-Policy" content="accelerometer=(), gyroscope=(), magnetometer=(), microphone=(), camera=(), speaker=(), usb=(), bluetooth=(), geolocation=(), payment=(), interest-cohort=(), autoplay=(), encrypted-media=(), fullscreen=(), picture-in-picture=(), sync-xhr=(), cross-origin-isolated=(), disabled-depth=(), disabled-width=(), disabled-height=(), unload=(), browsing-topics=()" />
    <title>Acceso Estudiantes | Charlotte</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase Environment Variables -->
    <script>
        // Firebase configuration - values will be replaced by Netlify during build
        window.FIREBASE_CONFIG = {
            apiKey: "AIzaSyC5QpmTOMpI36qczNrQmicpMmnQC8PZCe8",
            authDomain: "charlotte-a0d47.firebaseapp.com",
            projectId: "charlotte-a0d47",
            storageBucket: "charlotte-a0d47.firebasestorage.app",
            messagingSenderId: "971007838036",

    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            padding: 20px;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header img {
            width: 80px;
            margin-bottom: 15px;
        }
        .login-header h1 {
            font-size: 24px;
            color: #0a1628;
            margin: 0;
        }
        .login-header p {
            color: #64748b;
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0a1628;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8f0fe;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #d32f5f;
            transform: translateY(-2px);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e8f0fe;
        }
        .login-footer p {
            color: #64748b;
            margin-bottom: 10px;
        }
        .login-footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .message.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }
        .message.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover {
            opacity: 0.8;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-header h1 {
                font-size: 20px;
            }
            .back-link {
                position: static;
                display: inline-flex;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="Mesa de trabajo 3.png" alt="Charlotte">
                <h1>Acceso Estudiantes</h1>
                <p>Ingresa tus credenciales</p>
            </div>

            <div id="message" class="message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <p>¿No tienes cuenta?</p>
                <a href="registro.html">Registrarse</a>
                <br>
                <a href="reset-password.html" style="margin-top:10px;display:inline-block;">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, query, where, limit, getDocs, doc, getDoc, enableNetwork, disableNetwork } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

        console.log('🔐 Login module loaded at', new Date().toISOString());

        const firebaseConfig = window.FIREBASE_CONFIG;
        console.log('📦 Firebase config:', firebaseConfig.projectId);

        let app, db, auth;
        let firestoreReady = false;
        
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            console.log('✅ Firebase initialized successfully');
            
            // Forzar reconexión de Firestore y verificar conectividad
            enableNetwork(db).then(async () => {
                console.log('🌐 Firestore network enabled');
                // Test rápido de conectividad
                try {
                    const testQuery = query(collection(db, 'users'), limit(1));
                    await getDocs(testQuery);
                    firestoreReady = true;
                    console.log('✅ Firestore connection verified');
                } catch (e) {
                    console.warn('⚠️ Firestore test query failed:', e.message);
                }
            }).catch(err => {
                console.warn('⚠️ Could not enable network:', err.message);
            });
        } catch (initError) {
            console.error('❌ Firebase initialization error:', initError);
        }

        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        // Cache para usuarios recientes (mejora rendimiento)
        const userCache = new Map();
        const CACHE_DURATION = 5 * 60 * 1000; // 5 minutos

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            console.log(`📢 Message [${type}]: ${text}`);
        }

        // Función auxiliar para crear timeout con reintentos
        async function withRetry(promiseFn, maxRetries = 3, baseTimeoutMs = 15000) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    // Timeout aumenta con cada intento
                    const timeoutMs = baseTimeoutMs + (attempt - 1) * 5000;
                    console.log(`🔄 Attempt ${attempt}/${maxRetries} (timeout: ${timeoutMs}ms)...`);
                    
                    const result = await Promise.race([
                        promiseFn(),
                        new Promise((_, reject) =>
                            setTimeout(() => reject(new Error('timeout')), timeoutMs)
                        )
                    ]);
                    return result;
                } catch (error) {
                    console.warn(`⚠️ Attempt ${attempt} failed:`, error.message);
                    if (attempt === maxRetries) {
                        throw error;
                    }
                    // Esperar antes de reintentar (backoff exponencial)
                    const waitTime = 1500 * attempt;
                    console.log(`⏳ Waiting ${waitTime}ms before retry...`);
                    await new Promise(resolve => setTimeout(resolve, waitTime));
                }
            }
        }

        // Función auxiliar para crear timeout (legacy)
        function withTimeout(promise, timeoutMs = 15000) {
            return Promise.race([
                promise,
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('timeout')), timeoutMs)
                )
            ]);
        }

        if (!loginForm) {
            console.error('❌ Login form not found!');
        } else {
            console.log('✅ Login form found');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('📤 Form submitted');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = loginForm.querySelector('.btn-login');

            if (!email || !password) {
                showMessage('Por favor ingresa email y contraseña', 'error');
                return;
            }

            // Deshabilitar botón y mostrar indicador de carga
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Conectando...';

            // Verificar conectividad básica
            if (!navigator.onLine) {
                showMessage('Sin conexión a internet. Verifica tu conexión y vuelve a intentar.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Iniciar Sesión';
                return;
            }

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando sesión...';

            console.log('🔍 Login attempt for email:', email);
            const startTime = performance.now();

            try {
                console.log('📡 Starting user query...');
                const queryStartTime = performance.now();
                // Declarar variables
                let userData = null;
                let userDoc = null;

                // OPTIMIZACIÓN: Verificar cache primero
                const cachedUser = userCache.get(email);
                if (cachedUser && (Date.now() - cachedUser.timestamp) < CACHE_DURATION) {
                    console.log('✅ User found in cache');
                    userData = cachedUser.data;
                    userDoc = { id: cachedUser.id };
                } else {
                    // Consulta directa con reintentos
                    console.log('🔍 Searching for user in Firestore...');
                    console.log('🔗 Firestore ready status:', firestoreReady);
                    
                    const q = query(collection(db, 'users'), where('email', '==', email), limit(1));
                    
                    const querySnapshot = await withRetry(
                        () => getDocs(q),
                        3,  // 3 intentos
                        20000  // 20 segundos base timeout
                    );

                    if (!querySnapshot.empty) {
                        userDoc = querySnapshot.docs[0];
                        userData = userDoc.data();

                        // Guardar en cache
                        userCache.set(email, {
                            data: userData,
                            id: userDoc.id,
                            timestamp: Date.now()
                        });
                    } else {
                        showMessage('Usuario no encontrado.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'Iniciar Sesión';
                    }
                }

                const queryEndTime = performance.now();
                console.log('Query completed in', (queryEndTime - queryStartTime).toFixed(2), 'ms');

                if (userData) {
                    console.log('Login - User document ID:', userDoc.id);
                    console.log('Login - User data:', userData);

                    // Verificar contraseña
                    if (userData.authMethod === 'firebase') {
                        // Nuevo sistema: usar Firebase Auth para verificar
                        try {
                            const userCredential = await signInWithEmailAndPassword(auth, email, password);
                            console.log('Firebase Auth verificación exitosa');
                        } catch (authError) {
                            console.error('Firebase Auth error:', authError.code);
                            if (authError.code === 'auth/invalid-credential') {
                                showMessage('Contraseña incorrecta.', 'error');
                            } else if (authError.code === 'auth/user-not-found') {
                                showMessage('Usuario no encontrado.', 'error');
                            } else {
                                showMessage('Error de autenticación.', 'error');
                            }
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = 'Iniciar Sesión';
                            return;
                        }
                    } else {
                        // Sistema antiguo: verificar contraseña en texto plano
                        if (userData.password !== password) {
                            showMessage('Contraseña incorrecta.', 'error');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = 'Iniciar Sesión';
                            return;
                        }
                    }
                    
                    // Continuar con el login exitoso
                    console.log('Password verified, preparing user data...');
                    const currentUser = {
                            id: userDoc.id,  // Usar el ID real del documento
                            email: userData.email,
                            role: userData.role,
                            name: userData.name,
                            programa: userData.programa,
                            sede: userData.sede,
                            horario: userData.horario,
                            cedula: userData.cedula,
                            telefono: userData.telefono
                        };
                        sessionStorage.setItem('currentUser', JSON.stringify(currentUser));

                        console.log('User logged in successfully:', currentUser);
                        console.log('User logged in successfully:', currentUser.name);
                        const endTime = performance.now();
                        console.log('Total login time:', (endTime - startTime).toFixed(2), 'ms');

                        // Mostrar mensaje de éxito antes de redirigir
                        submitBtn.innerHTML = '<i class="fas fa-check"></i> ¡Éxito!';
                        submitBtn.style.background = '#10b981';

                        setTimeout(() => {
                            // Redirigir según el rol
                            if (userData.role === 'admin') {
                                sessionStorage.removeItem('adminActiveSection');
                                window.location.href = 'admin.html';
                            } else if (userData.role === 'student') {
                                window.location.href = 'estudiante.html';
                            } else {
                                showMessage('Rol no reconocido', 'error');
                                submitBtn.disabled = false;
                                submitBtn.innerHTML = 'Iniciar Sesión';
                                submitBtn.style.background = '';
                            }
                        }, 500);
                    }
                } catch (error) {
                console.error('Error during login:', error);
                let errorMessage = 'Error al iniciar sesión.';

                // Manejar errores de Firestore/timeout
                if (error.message === 'timeout') {
                    console.error('Timeout error - Firebase operation took too long');
                    errorMessage = 'Tiempo de espera agotado. Verifica tu conexión a internet e intenta nuevamente.';
                } else if (error.message && error.message.includes('offline')) {
                    console.error('Offline error detected');
                    errorMessage = 'Error de conexión. Verifica tu conexión a internet.';
                } else if (error.message && error.message.includes('network')) {
                    console.error('Network error detected');
                    errorMessage = 'Error de red. Inténtalo nuevamente.';
                } else if (error.message && error.message.includes('unavailable')) {
                    console.error('Service unavailable error');
                    errorMessage = 'Servicio temporalmente no disponible. Inténtalo más tarde.';
                } else if (error.message && error.message.includes('permission-denied')) {
                    errorMessage = 'Error de permisos. Contacta al administrador.';
                } else if (error.message && error.message.includes('not-found')) {
                    errorMessage = 'Usuario no encontrado.';
                } else {
                    // Errores genéricos
                    errorMessage = 'Error al iniciar sesión. Inténtalo nuevamente.';
                }

                showMessage(errorMessage, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
