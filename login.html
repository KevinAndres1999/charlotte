    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            padding: 20px;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header img {
            width: 80px;
            margin-bottom: 15px;
        }
        .login-header h1 {
            font-size: 24px;
            color: #0a1628;
            margin: 0;
        }
        .login-header p {
            color: #64748b;
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0a1628;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8f0fe;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #d32f5f;
            transform: translateY(-2px);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e8f0fe;
        }
        .login-footer p {
            color: #64748b;
            margin-bottom: 10px;
        }
        .login-footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .message.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }
        .message.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;

        @media (max-width: 480px) {

                padding: 30px 20px;

            .login-header h1 {
                font-size: 20px;
            }
            .back-link {
                position: static;
                display: inline-flex;
                margin: 20px;
            }
        }
    </style>

<body>
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="Mesa de trabajo 3.png" alt="Charlotte">
                <h1>Acceso Estudiantes</h1>
                <p>Ingresa tus credenciales</p>
            </div>

            <div id="message" class="message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <p>¿No tienes cuenta?</p>
                <a href="registro.html">Registrarse</a>
                <br>
                <a href="reset-password.html" style="margin-top:10px;display:inline-block;">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, query, where, limit, getDocs, doc, getDoc, updateDoc, deleteField, enableNetwork, disableNetwork } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

        console.log('🔐 Login module loaded at', new Date().toISOString());

        const firebaseConfig = window.FIREBASE_CONFIG;
        console.log('📦 Firebase config:', firebaseConfig.projectId);

        let app, db, auth;
        let firestoreReady = false;
        
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            console.log('✅ Firebase initialized successfully');
            
            // Forzar reconexión de Firestore y verificar conectividad
            enableNetwork(db).then(async () => {
                console.log('🌐 Firestore network enabled');
                // Test rápido de conectividad
                try {
                    const testQuery = query(collection(db, 'users'), limit(1));
                    await getDocs(testQuery);
                    firestoreReady = true;
                    console.log('✅ Firestore connection verified');
                } catch (e) {
                    console.warn('⚠️ Firestore test query failed:', e.message);
                }
            }).catch(err => {
                console.warn('⚠️ Could not enable network:', err.message);
            });
        } catch (initError) {
            console.error('❌ Firebase initialization error:', initError);
        }

        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        // Cache para usuarios recientes (mejora rendimiento)
        const userCache = new Map();
        const CACHE_DURATION = 30 * 1000; // 30 segundos - bajo para reflejar cambios de status rápidamente

        // Mensajes de estado de estudiante (graduado / retirado)
        function mostrarMensajeEstado(status, nombre) {
            // Limpiar sesión — no deben entrar a la plataforma
            sessionStorage.clear();

            const loginCard = document.querySelector('.login-card');
            const backLink = document.querySelector('.back-link');
            if (!loginCard) return;

            if (status === 'graduado') {
                loginCard.innerHTML = `
                    <div style="text-align:center; padding: 1rem 0;">
                        <div style="font-size:4rem; margin-bottom:1rem;">🎓</div>
                        <h2 style="color:#0a1628; margin-bottom:0.75rem;">¡Felicitaciones, ${nombre || 'estudiante'}!</h2>
                        <p style="color:#374151; line-height:1.7; margin-bottom:1.25rem;">
                            Esta plataforma es únicamente para el uso de los <strong>estudiantes activos</strong>.
                            Tú ya eres parte de nuestra historia como graduado de Charlotte.
                        </p>
                        <p style="color:#374151; line-height:1.7; margin-bottom:1.5rem;">
                            ¡Fue un honor tenerte aquí! Recuerda siempre lo aprendido y
                            lleva el nombre de Charlotte muy en alto. ✨
                        </p>
                        <div style="background:#fffbeb; border:1px solid #fcd34d; border-radius:12px; padding:1rem; margin-bottom:1.5rem; color:#92400e; font-size:0.9rem;">
                            <i class="fas fa-star" style="color:#f59e0b;"></i>
                            <strong> ¡Eres un graduado Charlotte!</strong><br>
                            Si necesitas comunicarte con nosotros, escríbenos por WhatsApp.
                        </div>
                        <a href="index.html" style="display:inline-block; padding:0.75rem 2rem; background:linear-gradient(135deg,#e63971,#0b3460); color:white; border-radius:8px; text-decoration:none; font-weight:600;">
                            <i class="fas fa-home"></i> Volver al inicio
                        </a>
                    </div>`;
            } else if (status === 'retirado') {
                loginCard.innerHTML = `
                    <div style="text-align:center; padding: 1rem 0;">
                        <div style="font-size:3.5rem; margin-bottom:1rem;">🚫</div>
                        <h2 style="color:#0a1628; margin-bottom:0.75rem;">Acceso no disponible</h2>
                        <p style="color:#374151; line-height:1.7; margin-bottom:1.5rem;">
                            Tu cuenta ya no tiene acceso activo a la plataforma Charlotte.
                            Si crees que esto es un error o deseas retomar tus estudios,
                            comunícate con nosotros.
                        </p>
                        <a href="index.html" style="display:inline-block; padding:0.75rem 2rem; background:#6b7280; color:white; border-radius:8px; text-decoration:none; font-weight:600;">
                            <i class="fas fa-home"></i> Volver al inicio
                        </a>
                    </div>`;
            }

            if (backLink) backLink.style.display = 'none';
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            console.log(`📢 Message [${type}]: ${text}`);
        }

        // Función auxiliar para crear timeout con reintentos
        async function withRetry(promiseFn, maxRetries = 3, baseTimeoutMs = 15000) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    // Timeout aumenta con cada intento
                    const timeoutMs = baseTimeoutMs + (attempt - 1) * 5000;
                    console.log(`🔄 Attempt ${attempt}/${maxRetries} (timeout: ${timeoutMs}ms)...`);
                    
                    const result = await Promise.race([
                        promiseFn(),
                        new Promise((_, reject) =>
                            setTimeout(() => reject(new Error('timeout')), timeoutMs)
                        )
                    ]);
                    return result;
                } catch (error) {
                    console.warn(`⚠️ Attempt ${attempt} failed:`, error.message);
                    if (attempt === maxRetries) {
                        throw error;
                    }
                    // Esperar antes de reintentar (backoff exponencial)
                    const waitTime = 1500 * attempt;
                    console.log(`⏳ Waiting ${waitTime}ms before retry...`);
                    await new Promise(resolve => setTimeout(resolve, waitTime));
                }
            }
        }

        // Función auxiliar para crear timeout (legacy)
        function withTimeout(promise, timeoutMs = 15000) {
            return Promise.race([
                promise,
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('timeout')), timeoutMs)
                )
            ]);
        }

        if (!loginForm) {
            console.error('❌ Login form not found!');
        } else {
            console.log('✅ Login form found');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('📤 Form submitted');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = loginForm.querySelector('.btn-login');

            if (!email || !password) {
                showMessage('Por favor ingresa email y contraseña', 'error');
                return;
            }

            // Deshabilitar botón y mostrar indicador de carga
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Conectando...';

            // Verificar conectividad básica
            if (!navigator.onLine) {
                showMessage('Sin conexión a internet. Verifica tu conexión y vuelve a intentar.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Iniciar Sesión';
                return;
            }

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando sesión...';

            console.log('🔍 Login attempt for email:', email);
            const startTime = performance.now();

            try {
                console.log('📡 Starting user query...');
                const queryStartTime = performance.now();
                // Declarar variables
                let userData = null;
                let userDoc = null;

                // OPTIMIZACIÓN: Verificar cache primero
                const cachedUser = userCache.get(email);
                if (cachedUser && (Date.now() - cachedUser.timestamp) < CACHE_DURATION) {
                    console.log('✅ User found in cache');
                    userData = cachedUser.data;
                    userDoc = { id: cachedUser.id };
                } else {
                    // Consulta directa con reintentos
                    console.log('🔍 Searching for user in Firestore...');
                    console.log('🔗 Firestore ready status:', firestoreReady);
                    
                    const q = query(collection(db, 'users'), where('email', '==', email), limit(1));
                    
                    const querySnapshot = await withRetry(
                        () => getDocs(q),
                        3,  // 3 intentos
                        20000  // 20 segundos base timeout
                    );

                    if (!querySnapshot.empty) {
                        userDoc = querySnapshot.docs[0];
                        userData = userDoc.data();

                        // Guardar en cache
                        userCache.set(email, {
                            data: userData,
                            id: userDoc.id,
                            timestamp: Date.now()
                        });
                    } else {
                        showMessage('Usuario no encontrado.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'Iniciar Sesión';
                    }
                }

                const queryEndTime = performance.now();
                console.log('Query completed in', (queryEndTime - queryStartTime).toFixed(2), 'ms');

                if (userData) {
                    console.log('Login - User document ID:', userDoc.id);
                    console.log('Login - User data:', userData);

                    // Verificar contraseña
                    if (userData.authMethod === 'firebase') {
                        // Nuevo sistema: usar Firebase Auth para verificar
                        try {
                            const userCredential = await signInWithEmailAndPassword(auth, email, password);
                            console.log('Firebase Auth verificación exitosa');
                        } catch (authError) {
                            console.error('Firebase Auth error:', authError.code);
                            if (authError.code === 'auth/invalid-credential') {
                                showMessage('Contraseña incorrecta.', 'error');
                            } else if (authError.code === 'auth/user-not-found') {
                                showMessage('Usuario no encontrado.', 'error');
                            } else {
                                showMessage('Error de autenticación.', 'error');
                            }
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = 'Iniciar Sesión';
                            return;
                        }
                    } else {
                        // Sistema legado: verificar contraseña en texto plano
                        if (userData.password !== password) {
                            showMessage('Contraseña incorrecta.', 'error');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = 'Iniciar Sesión';
                            return;
                        }
                        // Contraseña correcta — intentar migrar automáticamente a Firebase Auth
                        // Saltar migración si ya se detectó conflicto previamente
                        try {
                            let migrationOk = false;
                            if (userData.migrationConflict) {
                                // Conflicto previo conocido: omitir migración para evitar errores 400 repetidos
                                console.log('ℹ️ Migración saltada: conflicto previo registrado.');
                            } else {
                                try {
                                    await createUserWithEmailAndPassword(auth, email, password);
                                    migrationOk = true;
                                } catch (createErr) {
                                    if (createErr.code === 'auth/email-already-in-use') {
                                        // Ya existe en Firebase Auth — verificar que la contraseña coincida
                                        try {
                                            await signInWithEmailAndPassword(auth, email, password);
                                            migrationOk = true;
                                        } catch (signInErr) {
                                            // Contraseña difiere — marcar en Firestore y enviar reset
                                            console.warn('⚠️ Migración: usuario existe en Firebase Auth con contraseña diferente. Marcando conflicto.');
                                            const docId = userDoc.id || (userDoc.docs ? userDoc.docs[0].id : null);
                                            if (docId) {
                                                try {
                                                    await updateDoc(doc(db, 'users', docId), { migrationConflict: true });
                                                    userCache.delete(email);
                                                } catch (e) { /* omitir */ }
                                            }
                                            // Enviar email de restablecimiento de contraseña silenciosamente
                                            try { await sendPasswordResetEmail(auth, email); } catch (e) { /* omitir */ }
                                        }
                                    }
                                    // cualquier otro error de createUser → omitir migración silenciosamente
                                }
                            }
                            if (migrationOk) {
                                const docId = userDoc.id || (userDoc.docs ? userDoc.docs[0].id : null);
                                if (docId) {
                                    await updateDoc(doc(db, 'users', docId), {
                                        authMethod: 'firebase',
                                        password: deleteField()
                                    });
                                    userCache.delete(email);
                                }
                                console.log('✅ Usuario migrado a Firebase Auth');
                            } else if (!userData.migrationConflict) {
                                // Si la migración falló y no es por conflicto, para admins forzar el signIn
                                // para que puedan obtener el ID token
                                if (userData.role === 'admin') {
                                    try {
                                        await signInWithEmailAndPassword(auth, email, password);
                                        console.log('ℹ️ Admin sign-in en Firebase Auth para obtener ID token');
                                    } catch (adminSignInErr) {
                                        console.warn('⚠️ No se pudo hacer sign-in de admin en Firebase Auth:', adminSignInErr.code);
                                    }
                                }
                            }
                        } catch (migErr) {
                            console.warn('⚠️ No se pudo migrar usuario a Firebase Auth:', migErr.message);
                        }
                    }
                    
                    // Continuar con el login exitoso
                    console.log('Password verified, preparing user data...');
                    const currentUser = {
                            id: userDoc.id,  // Usar el ID real del documento
                            email: userData.email,
                            role: userData.role,
                            name: userData.name,
                            programa: userData.programa,
                            sede: userData.sede,
                            horario: userData.horario
                            // cedula y telefono NO se guardan en sessionStorage (PII sensible)
                        };
                        sessionStorage.setItem('currentUser', JSON.stringify(currentUser));

                        // Para admins, guardar el ID token de Firebase para operaciones privilegiadas
                        if (userData.role === 'admin') {
                            try {
                                if (auth.currentUser) {
                                    const idToken = await auth.currentUser.getIdToken();
                                    sessionStorage.setItem('adminIdToken', idToken);
                                    console.log('✅ Firebase ID token guardado para admin');
                                } else {
                                    console.warn('⚠️ No hay usuario autenticado en Firebase Auth. Intentando autenticar admin...');
                                    try {
                                        // Intentar signIn directo como último recurso
                                        const userCredential = await signInWithEmailAndPassword(auth, email, password);
                                        const idToken = await userCredential.user.getIdToken();
                                        sessionStorage.setItem('adminIdToken', idToken);
                                        console.log('✅ Admin autenticado y token guardado en segundo intento');
                                    } catch (signInErr) {
                                        console.warn('⚠️ No se pudo obtener token de Firebase Auth:', signInErr.code);
                                    }
                                }
                            } catch (e) {
                                console.warn('⚠️ No se pudo guardar ID token:', e);
                            }
                        }

                        console.log('User logged in successfully:', currentUser);
                        console.log('User logged in successfully:', currentUser.name);
                        
                        // Obtener token JWT del backend para videoconferencias
                        try {
                            console.log('🔐 Obteniendo token JWT del backend...');
                            const backendUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://charlotte-video-server.onrender.com';
                            
                            // Intentar login en el backend
                            let tokenResponse = await fetch(`${backendUrl}/api/login`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ email: userData.email, password: password })
                            });
                            
                            // Si el usuario no existe en el backend (error 401), registrarlo automáticamente
                            if (!tokenResponse.ok && tokenResponse.status === 401) {
                                console.log('👤 Usuario no existe en backend, registrando automáticamente...');
                                const registerResponse = await fetch(`${backendUrl}/api/register`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ 
                                        name: userData.name || 'Usuario',
                                        email: userData.email, 
                                        password: password 
                                    })
                                });
                                
                                if (registerResponse.ok) {
                                    console.log('✅ Usuario registrado en backend, obteniendo token...');
                                    // Reintentar login después del registro
                                    tokenResponse = await fetch(`${backendUrl}/api/login`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ email: userData.email, password: password })
                                    });
                                } else {
                                    console.warn('⚠️ No se pudo registrar usuario en backend');
                                }
                            }
                            
                            // Guardar el token si el login fue exitoso
                            if (tokenResponse.ok) {
                                const tokenData = await tokenResponse.json();
                                localStorage.setItem('authToken', tokenData.token);
                                console.log('✅ Token JWT obtenido y guardado');
                            } else {
                                console.warn('⚠️ No se pudo obtener token del backend, continuando sin él');
                            }
                        } catch (tokenError) {
                            console.warn('⚠️ Error obteniendo token del backend:', tokenError.message);
                        }
                        
                        const endTime = performance.now();
                        console.log('Total login time:', (endTime - startTime).toFixed(2), 'ms');

                        // Asegurar que userData tiene rol (backwards compatibility para usuarios antiguos)
                        if (!userData.role) {
                            userData.role = userData.status === 'admin' ? 'admin' : 'student';
                            // Actualizar en Firestore también
                            try {
                                await updateDoc(doc(db, 'users', userDoc.id), { role: userData.role });
                            } catch (e) {
                                console.warn('No se pudo actualizar el rol en Firestore:', e);
                            }
                        }

                        console.log('User role:', userData.role, 'Status:', userData.status);

                        // Mostrar mensaje de éxito antes de redirigir
                        submitBtn.innerHTML = '<i class="fas fa-check"></i> ¡Éxito!';
                        submitBtn.style.background = '#10b981';

                        setTimeout(() => {
                            // Redirigir según el rol
                            if (userData.role === 'admin') {
                                sessionStorage.removeItem('adminActiveSection');
                                window.location.href = 'admin.html';
                            } else if (userData.role === 'student') {
                                const status = userData.status || 'cursando';
                                if (status === 'graduado' || status === 'retirado') {
                                    // Limpiar sesión y mostrar mensaje de estado
                                    mostrarMensajeEstado(status, userData.name);
                                    submitBtn.disabled = false;
                                    submitBtn.innerHTML = 'Iniciar Sesión';
                                    submitBtn.style.background = '';
                                } else if (status === 'pending') {
                                    // Usuario pendiente de aprobación
                                    showMessage('Tu registro está pendiente de aprobación. El administrador lo revisará pronto.', 'warning');
                                    submitBtn.disabled = false;
                                    submitBtn.innerHTML = 'Iniciar Sesión';
                                    submitBtn.style.background = '';
                                } else {
                                    // 'cursando' o 'active' (compatibilidad) → acceso normal
                                    window.location.href = 'estudiante.html';
                                }
                            } else {
                                console.error('Rol desconocido:', userData.role);
                                showMessage('Rol no reconocido. Por favor contacta al administrador.', 'error');
                                submitBtn.disabled = false;
                                submitBtn.innerHTML = 'Iniciar Sesión';
                                submitBtn.style.background = '';
                            }
                        }, 500);
                    }
                } catch (error) {
                console.error('Error during login:', error);
                let errorMessage = 'Error al iniciar sesión.';

                // Manejar errores de Firestore/timeout
                if (error.message === 'timeout') {
                    console.error('Timeout error - Firebase operation took too long');
                    errorMessage = 'Tiempo de espera agotado. Verifica tu conexión a internet e intenta nuevamente.';
                } else if (error.message && error.message.includes('offline')) {
                    console.error('Offline error detected');
                    errorMessage = 'Error de conexión. Verifica tu conexión a internet.';
                } else if (error.message && error.message.includes('network')) {
                    console.error('Network error detected');
                    errorMessage = 'Error de red. Inténtalo nuevamente.';
                } else if (error.message && error.message.includes('unavailable')) {
                    console.error('Service unavailable error');
                    errorMessage = 'Servicio temporalmente no disponible. Inténtalo más tarde.';
                } else if (error.message && error.message.includes('permission-denied')) {
                    errorMessage = 'Error de permisos. Contacta al administrador.';
                } else if (error.message && error.message.includes('not-found')) {
                    errorMessage = 'Usuario no encontrado.';
                } else {
                    // Errores genéricos
                    errorMessage = 'Error al iniciar sesión. Inténtalo nuevamente.';
                }

                showMessage(errorMessage, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
