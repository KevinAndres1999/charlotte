<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — Mi cuenta</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="./firebase-config-loader.js"></script>
</head>
<body>
  <header><h1>Mi Cuenta</h1><nav><a href="index.html">Catálogo</a> | <a href="login.html">Salir</a></nav></header>
  <main>
    <section id="profile">
      <h2>Perfil</h2>
      <div id="userName">Cargando...</div>
    </section>

    <section id="myCourses">
      <h2>Cursos</h2>
      <div id="courses"></div>
    </section>
    <section id="myApproved">
      <h2>Mis inscripciones aprobadas</h2>
      <div id="approved"></div>
    </section>
  </main>

  <script type="module">
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    import { showToast } from './toast.js';

    async function init(){
      const app = getApp();
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, async user => {
        if(!user){
          // No autenticado -> redirigir a login
          window.location.href = 'login.html';
          return;
        }

        document.getElementById('userName').textContent = user.email || user.uid;

        // Cargar catálogo de cursos y permitir solicitar inscripción (va a pendingStudents)
        const cols = collection(db, 'courses');
        const snap = await getDocs(cols);
        const container = document.getElementById('courses');
        container.innerHTML = '';
        snap.forEach(doc => {
          const d = doc.data();
          const el = document.createElement('div');
          el.className = 'course-card';
          el.innerHTML = `
            <h3>${d.title}</h3>
            <p>${d.description||''}</p>
            <a href="course.html?courseId=${doc.id}">Ver curso</a>
            <button data-id="${doc.id}">Solicitar inscripción</button>
          `;
          const btn = el.querySelector('button');
          btn.addEventListener('click', async ()=>{
            btn.disabled = true; btn.textContent = 'Enviando...';
            try{
              await addDoc(collection(db, 'pendingStudents'), {
                email: user.email || null,
                uid: user.uid,
                courseId: doc.id,
                createdAt: new Date().toISOString()
              });
              btn.textContent = 'Solicitud enviada';
              showToast('Solicitud enviada', 'success');
            }catch(err){
              console.error('enroll error', err);
              btn.textContent = 'Error, reintenta';
              btn.disabled = false;
              showToast('Error enviando solicitud', 'error');
            }
          });
          container.appendChild(el);
        });
        // Cargar inscripciones aprobadas del usuario
        try{
          const approvedSnap = await getDocs(collection(db, 'approvedStudents'));
          const approvedContainer = document.getElementById('approved');
          approvedContainer.innerHTML = '';
          approvedSnap.forEach(d => {
            const data = d.data();
            if(data.uid === user.uid || data.email === user.email){
              const el = document.createElement('div');
              el.className = 'approved-item';
              el.textContent = `${data.courseId} — aprobado: ${data.approvedAt || ''}`;
              approvedContainer.appendChild(el);
            }
          });
          if(approvedContainer.children.length === 0) approvedContainer.textContent = 'No tienes inscripciones aprobadas.';
        }catch(err){ console.error('load approved', err); }
      });
    }

    window.addEventListener('firebase-ready', init);
  </script>
</body>
</html>
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="./firebase-config-loader.js"></script>
</head>
<body>
  <main>
    <h2>Mi panel</h2>
    <div id="userInfo"></div>
    <h3>Mis cursos</h3>
    <div id="myCourses"></div>
  </main>

  <script type="module">
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';

    async function init(){
      const app = getApp();
      const auth = getAuth(app);
      const db = getFirestore(app);
      onAuthStateChanged(auth, async user =>{
        if(!user) { window.location.href='login.html'; return }
        document.getElementById('userInfo').textContent = 'Conectado: '+(user.email||user.displayName);
        // Cargar cursos (enrollments)
        const q = query(collection(db,'enrollments'), where('userId','==', user.uid));
        const snap = await getDocs(q);
        const container = document.getElementById('myCourses');
        snap.forEach(doc => {
          const d = doc.data();
          const el = document.createElement('div'); el.textContent = d.courseTitle || d.courseId; container.appendChild(el);
        });
      });
    }

    window.addEventListener('firebase-ready', init);
  </script>
</body>
</html>
