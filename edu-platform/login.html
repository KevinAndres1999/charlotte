<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/edu-platform/login.css">
  <script type="module" src="./firebase-config-loader.js"></script>
</head>
<body>
  <div class="login-root">
    <div class="login-card container">
      <div class="login-left">
        <img src="/mesa%20de%20trabajo%203.png" alt="logo" class="brand-logo-large">
        <h2 class="login-title">Accede a tu cuenta</h2>
        <p class="login-sub">Entra con tus credenciales o regístrate para acceder a la plataforma</p>

        <div id="forms">
          <div id="errorPanel" style="display:none;margin-bottom:8px;padding:8px;border-radius:6px;background:#fff6f6;border:1px solid #f2dede;color:#7a1a1a"></div>
          <form id="loginForm">
            <div class="form-field"><label for="email">Correo electrónico</label><input id="email" type="email" required></div>
            <div class="form-field"><label for="password">Contraseña</label><input id="password" type="password" required></div>
            <div class="actions"><button class="btn-full" type="submit">Entrar</button></div>
            <div style="margin-top:8px" class="small-meta">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></div>
          </form>

          <form id="registerForm" style="display:none">
            <div class="form-field"><label for="rname">Nombre completo</label><input id="rname" type="text" required></div>
            <div class="form-field"><label for="rcedula">Cédula</label><input id="rcedula" type="text" inputmode="numeric" pattern="\d+" required></div>
            <div class="form-field"><label for="rsede">Sede</label>
              <select id="rsede" required>
                <option value="">-- Selecciona sede --</option>
                <option value="Carapungo">Carapungo</option>
                <option value="Sangolquí">Sangolquí</option>
                <option value="Saquisilí">Saquisilí</option>
              </select>
            </div>
            <div class="form-field"><label for="rprograma">Programa</label>
              <select id="rprograma" required>
                <option value="">-- Selecciona programa --</option>
                <option value="Belleza Integral">Belleza Integral</option>
                <option value="Panadería y Pastelería">Panadería y Pastelería</option>
                <option value="Asesoría Técnica">Asesoría Técnica</option>
              </select>
            </div>
            <div class="form-field"><label for="remail">Correo electrónico</label><input id="remail" type="email" required></div>
            <div class="form-field"><label for="rpassword">Contraseña</label><input id="rpassword" type="password" required></div>
            <div class="actions"><button class="btn-full" type="submit">Crear cuenta</button></div>
            <div style="margin-top:8px" class="small-meta">¿Ya tienes cuenta? <a href="#" id="showLogin">Entrar</a></div>
          </form>
        </div>
      </div>

      <div class="login-right">
        <h3 style="margin:0 0 8px;color:var(--navy)">Bienvenido a CHARLOTTE</h3>
        <p style="color:var(--muted);text-align:center;max-width:360px">Transforma tu futuro profesional con cursos prácticos, certificaciones y apoyo emprendedor.</p>
        <div class="social-row" style="margin-top:12px;gap:12px;display:flex;justify-content:center;align-items:center">
          <a class="social" href="https://m.facebook.com/cursoscharlotte/" target="_blank" rel="noopener" aria-label="Facebook">
            <!-- Facebook SVG -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22 12C22 6.48 17.52 2 12 2S2 6.48 2 12c0 4.84 3.44 8.85 8 9.8V14.7h-2.4v-2.7H10V9.6c0-2.4 1.44-3.7 3.64-3.7 1.06 0 2.18.18 2.18.18v2.4h-1.23c-1.21 0-1.59.76-1.59 1.54v1.84h2.7l-.43 2.7h-2.27v7.1c4.56-.95 8-4.96 8-9.8z" fill="#1877F2"/></svg>
          </a>
          <a class="social" href="https://www.instagram.com/cursoscharlotte/" target="_blank" rel="noopener" aria-label="Instagram">
            <!-- Instagram SVG -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#E1306C" stroke-width="1.6" fill="none"/><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z" stroke="#E1306C" stroke-width="1.6" fill="none"/></svg>
          </a>
          <a class="social" href="https://www.tiktok.com/@cursoscharlotte" target="_blank" rel="noopener" aria-label="TikTok">
            <!-- TikTok SVG (simple) -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 8v8a4 4 0 1 0 4-4V6h3a4 4 0 1 0 0-2h-3v4a6 6 0 1 1-4 5.66V8z" fill="#010101"/></svg>
          </a>
          <a class="social" href="https://wa.me/+593964245339" target="_blank" rel="noopener" aria-label="WhatsApp">
            <!-- WhatsApp SVG -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20.5 3.5A11.9 11.9 0 0 0 12 1C6 1 1.3 5.7 1.3 11.7c0 2 .5 3.9 1.4 5.6L1 23l5.9-1.5a11.6 11.6 0 0 0 5.1 1.1h.1c6 0 10.8-4.7 10.8-10.8 0-3-1.2-5.8-3.3-7.4z" fill="#25D366"/></svg>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import { showToast } from './toast.js';

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const showRegister = document.getElementById('showRegister');
    const showLogin = document.getElementById('showLogin');

    function toggleForms(to){
      if(to === 'register'){ loginForm.style.display = 'none'; registerForm.style.display = 'block'; }
      else { loginForm.style.display = 'block'; registerForm.style.display = 'none'; }
    }

    showRegister.addEventListener('click', e=>{ e.preventDefault(); toggleForms('register'); });
    showLogin.addEventListener('click', e=>{ e.preventDefault(); toggleForms('login'); });

    async function init(){
      // helper to show errors on screen
      function showError(msg){
        try{
          const p = document.getElementById('errorPanel');
          if(!p) return console.error('errorPanel missing', msg);
          p.textContent = msg;
          p.style.display = 'block';
        }catch(e){ console.error('showError', e, msg); }
      }

      window.addEventListener('error', e=>{ console.error('window.error', e); showError(e.message || String(e)); });
      window.addEventListener('unhandledrejection', e=>{ console.error('unhandledrejection', e); showError(e.reason ? (e.reason.message||String(e.reason)) : 'Promise rejected'); });

      const app = getApp();
      const auth = getAuth(app);
      const db = getFirestore(app);
      console.log('firebase init ready in login');

      loginForm.addEventListener('submit', async e=>{
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        if(!email || !pass){ showToast('Rellena email y contraseña.', 'error'); return; }
        try{
          showToast('Iniciando sesión...', 'info');
          const cred = await signInWithEmailAndPassword(auth, email, pass);
          console.log('login success', cred.user && cred.user.uid);
          const idToken = await cred.user.getIdToken();
          sessionStorage.setItem('idToken', idToken);
          sessionStorage.setItem('userUid', cred.user.uid);
          window.location.href = '/edu-platform/dashboard.html';
        }catch(err){ console.error(err); showToast('Error al iniciar sesión: '+(err.message||''),'error'); showError(err.message||String(err)); }
      });

      registerForm.addEventListener('submit', async e=>{
        e.preventDefault();
        const name = document.getElementById('rname').value.trim();
        const cedula = document.getElementById('rcedula').value.trim();
        const sede = document.getElementById('rsede').value;
        const programa = document.getElementById('rprograma').value;
        const email = document.getElementById('remail').value.trim();
        const pass = document.getElementById('rpassword').value;
        if(!name || !cedula || !sede || !programa || !email || !pass){ showToast('Completa todos los campos.', 'error'); return; }
        try{
          showToast('Creando cuenta...', 'info');
          const userCred = await createUserWithEmailAndPassword(auth, email, pass);
          console.log('register: created user', userCred.user && userCred.user.uid);
          await updateProfile(userCred.user, { displayName: name });
          const idToken = await userCred.user.getIdToken();
          sessionStorage.setItem('idToken', idToken);
          sessionStorage.setItem('userUid', userCred.user.uid);
          await setDoc(doc(db,'users', userCred.user.uid), { name, email, cedula, sede, programa, createdAt: serverTimestamp() });
          showToast('Cuenta creada. Redirigiendo...', 'success');
          window.location.href = '/edu-platform/dashboard.html';
        }catch(err){ console.error(err); showToast('Error: '+(err.message||''),'error'); showError(err.message||String(err)); }
      });
    }

    window.addEventListener('firebase-ready', init);
  </script>
</body>
</html>
