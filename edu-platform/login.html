<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="./firebase-config-loader.js"></script>
</head>
<body>
  <main>
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="msg"></div>
  </main>
  <script type="module">
    import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { showToast } from './toast.js';

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    async function init(){
      const auth = getAuth(getApp());
      const submit = form.querySelector('button[type=submit]');
      form.addEventListener('submit', async e=>{
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        if(!email || !pass){ showToast('Rellena email y contraseña.', 'error'); return; }
        submit.disabled = true; showToast('Iniciando sesión...', 'info');
        try{
          await signInWithEmailAndPassword(auth, email, pass);
          sessionStorage.setItem('user', email);
          window.location.href = 'dashboard.html';
        }catch(err){
          console.error('login error', err);
          const code = err.code || '';
          if(code.includes('auth/wrong-password')) showToast('Contraseña incorrecta.', 'error');
          else if(code.includes('auth/user-not-found')) showToast('Usuario no encontrado.', 'error');
          else showToast('Error: '+(err.message || 'no se pudo iniciar sesión'), 'error');
        }finally{ submit.disabled = false; }
      });
    }

    window.addEventListener('firebase-ready', init);
  </script>
</body>
</html>
