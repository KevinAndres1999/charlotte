<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curso — Detalles</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="./firebase-config-loader.js"></script>
</head>
<body>
  <header><h1>Curso</h1><nav><a href="index.html">Catálogo</a> | <a href="dashboard.html">Mi cuenta</a></nav></header>
  <main>
    <section id="courseDetail">
      <h2 id="title">Cargando...</h2>
      <div id="desc"></div>
    </section>
  </main>

  <script type="module">
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    function qs(name){
      return new URLSearchParams(location.search).get(name);
    }

    async function init(){
      const app = getApp();
      const db = getFirestore(app);
      const courseId = qs('courseId');
      if(!courseId){ document.getElementById('title').textContent = 'Curso no especificado'; return; }
      try{
        const dref = doc(db, 'courses', courseId);
        const snap = await getDoc(dref);
        if(!snap.exists()) { document.getElementById('title').textContent = 'Curso no encontrado'; return; }
        const data = snap.data();
        document.getElementById('title').textContent = data.title || 'Sin título';
        document.getElementById('desc').textContent = data.description || '';
      }catch(err){ console.error('course load', err); document.getElementById('title').textContent = 'Error cargando curso'; }
    }

    window.addEventListener('firebase-ready', init);
  </script>
</body>
</html>
