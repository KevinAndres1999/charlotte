<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="./firebase-config-loader.js"></script>
</head>
<body>
  <main>
    <h2>Registro</h2>
    <form id="regForm">
      <label for="name">Nombre</label>
      <input id="name" type="text" required>
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" required>
      <button type="submit">Crear cuenta</button>
    </form>
    <div id="msg"></div>
  </main>
  <script type="module">
    import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { showToast } from './toast.js';

    const form = document.getElementById('regForm');
    const msg = document.getElementById('msg');

    async function init(){
      const app = getApp();
      const auth = getAuth(app);
      const db = getFirestore(app);
      const submit = form.querySelector('button[type=submit]');

      form.addEventListener('submit', async e=>{
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;

        if(!name || !email || !pass){
          showToast('Rellena todos los campos.', 'error');
          return;
        }
        if(pass.length < 6){
          showToast('La contraseña debe tener al menos 6 caracteres.', 'error');
          return;
        }

        submit.disabled = true;
        msg.textContent = 'Creando cuenta...';

        try{
          const uc = await createUserWithEmailAndPassword(auth, email, pass);
          await setDoc(doc(db, 'users', uc.user.uid), { name, email, role: 'student', createdAt: new Date().toISOString() });
          showToast('Cuenta creada. Redirigiendo...', 'success');
          setTimeout(()=>window.location.href='dashboard.html',1200);
        }catch(err){
          console.error('registro error', err);
          const code = err.code || '';
          if(code.includes('auth/email-already-in-use')) showToast('Este email ya está registrado.', 'error');
          else if(code.includes('auth/weak-password')) showToast('Contraseña demasiado débil.', 'error');
          else showToast('Error: '+(err.message || 'error al crear la cuenta'), 'error');
        }finally{
          submit.disabled = false;
        }
      });
    }

    window.addEventListener('firebase-ready', init);
  </script>
</body>
</html>
