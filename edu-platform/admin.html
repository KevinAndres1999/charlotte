<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Aprobaciones</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="./firebase-config-loader.js"></script>
</head>
<body>
  <header><h1>Panel Admin</h1><nav><a href="index.html">Catálogo</a> | <a href="dashboard.html">Mi cuenta</a></nav></header>
  <main>
    <section id="authMsg">Comprobando permisos...</section>
    <section id="pendingSection" style="display:none">
      <h2>Solicitudes pendientes</h2>
      <div id="pendingList">Cargando...</div>
    </section>
    <section id="coursesSection" style="display:none">
      <h2>Gestión de cursos</h2>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <button id="exportApproved" class="btn secondary">Exportar aprobados (CSV)</button>
      </div>
      <form id="courseForm">
        <label>Título</label>
        <input id="courseTitle" required />
        <label>Descripción</label>
        <textarea id="courseDesc"></textarea>
        <button type="submit">Crear curso</button>
      </form>
      <div id="courseList">Cargando cursos...</div>
    </section>
  </main>

  <script type="module">
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    import { showToast } from './toast.js';

    async function loadPending(db){
      const list = document.getElementById('pendingList');
      list.innerHTML = '';
      try{
        const snap = await getDocs(collection(db,'pendingStudents'));
        if(snap.empty){ list.textContent = 'No hay solicitudes pendientes.'; return; }
        snap.forEach(d=>{
          const data = d.data();
          const el = document.createElement('div');
          el.className = 'pending-item';
          el.innerHTML = `
            <strong>${data.email||data.uid||'sin email'}</strong>
            <div>Curso: ${data.courseId || '—'}</div>
            <div>Fecha: ${data.createdAt || ''}</div>
            <button data-id='${d.id}' class='approve'>Aprobar</button>
            <button data-id='${d.id}' class='reject'>Rechazar</button>
          `;
          el.querySelector('.approve').addEventListener('click', async ()=>{
            const id = d.id;
            try{
              const approvedRef = doc(db,'approvedStudents', id);
              await setDoc(approvedRef, { ...data, approvedAt: new Date().toISOString() });
              await deleteDoc(doc(db,'pendingStudents', id));
              el.remove();
              showToast('Solicitud aprobada', 'success');
            }catch(err){ console.error('approve', err); alert('Error al aprobar'); }
          });
          el.querySelector('.reject').addEventListener('click', async ()=>{
            const id = d.id;
            try{ await deleteDoc(doc(db,'pendingStudents', id)); el.remove(); }
            catch(err){ console.error('reject', err); alert('Error al rechazar'); }
          });
          list.appendChild(el);
        });
      }catch(err){ console.error('loadPending', err); list.textContent = 'Error cargando solicitudes.'; }
    }

    async function init(){
      const app = getApp();
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, async user => {
        const authMsg = document.getElementById('authMsg');
        if(!user){ authMsg.textContent = 'No autenticado. Accede con una cuenta admin.'; return; }

        try{
          const udoc = await (await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js')).getDoc(doc(db,'users',user.uid));
          const role = udoc.exists() ? udoc.data().role : null;
          if(!role || !['admin','teacher'].includes(role)){
            authMsg.textContent = 'No tienes permisos de admin.';
            return;
          }
          authMsg.style.display = 'none';
              document.getElementById('pendingSection').style.display = 'block';
              document.getElementById('coursesSection').style.display = 'block';
              await loadPending(db);
              await loadCoursesAdmin(db);
        }catch(err){ console.error('auth check', err); authMsg.textContent = 'Error comprobando permisos.'; }
      });
    }

        async function loadCoursesAdmin(db){
          const list = document.getElementById('courseList');
          list.innerHTML = '';
          try{
            const snap = await getDocs(collection(db,'courses'));
            if(snap.empty) list.textContent = 'No hay cursos.';
            snap.forEach(d=>{
              const data = d.data();
              const el = document.createElement('div');
              el.className = 'course-admin-item';
              el.innerHTML = `
                <strong>${data.title||'Sin título'}</strong>
                <div>${data.description||''}</div>
                <button data-id='${d.id}' class='delete'>Eliminar</button>
              `;
              el.querySelector('.delete').addEventListener('click', async ()=>{
                try{ await deleteDoc(doc(db,'courses', d.id)); el.remove(); showToast('Curso eliminado', 'success'); }
                catch(err){ console.error('delete course', err); showToast('Error eliminando curso', 'error'); }
              });
              list.appendChild(el);
            });
          }catch(err){ console.error('load courses admin', err); list.textContent = 'Error cargando cursos.'; }
        }

        // Crear curso
        document.addEventListener('submit', async e=>{
          if(e.target && e.target.id === 'courseForm'){
            e.preventDefault();
            const title = document.getElementById('courseTitle').value.trim();
            const desc = document.getElementById('courseDesc').value.trim();
            if(!title) return alert('Titulo requerido');
            try{
              const db = getFirestore(getApp());
              await addDoc(collection(db,'courses'), { title, description: desc, createdAt: new Date().toISOString() });
              document.getElementById('courseTitle').value=''; document.getElementById('courseDesc').value='';
              await loadCoursesAdmin(db);
              showToast('Curso creado', 'success');
            }catch(err){ console.error('create course', err); showToast('Error creando curso', 'error'); }
          }
        });

        // Exportar approvedStudents a CSV
        async function exportApprovedCSV(db){
          try{
            const snap = await getDocs(collection(db,'approvedStudents'));
            if(snap.empty){ alert('No hay aprobados para exportar.'); return; }
            const rows = [];
            const headers = ['id','email','uid','courseId','approvedAt'];
            snap.forEach(d=>{
              const data = d.data();
              rows.push([d.id||'', data.email||'', data.uid||'', data.courseId||'', data.approvedAt||'']);
            });
            const csv = [headers.join(',')].concat(rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `approved_students_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('CSV descargado', 'success');
          }catch(err){ console.error('export csv', err); alert('Error exportando CSV'); }
        }

        document.getElementById('exportApproved').addEventListener('click', async ()=>{
          const db = getFirestore(getApp());
          await exportApprovedCSV(db);
        });

    window.addEventListener('firebase-ready', init);
  </script>
</body>
</html>
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="./firebase-config-loader.js"></script>
</head>
<body>
  <main>
    <h2>Panel Admin (básico)</h2>
    <section>
      <h3>Crear curso de ejemplo</h3>
      <form id="courseForm">
        <input id="title" placeholder="Título" required>
        <textarea id="desc" placeholder="Descripción"></textarea>
        <button type="submit">Crear</button>
      </form>
      <div id="msg"></div>
    </section>
  </main>
  <script type="module">
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import { getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';

    async function init(){
      const app = getApp();
      const auth = getAuth(app);
      const db = getFirestore(app);
      onAuthStateChanged(auth, user =>{
        if(!user) { window.location.href='login.html'; return }
      });

      const form = document.getElementById('courseForm');
      const msg = document.getElementById('msg');
      form.addEventListener('submit', async e=>{
        e.preventDefault();
        const title = document.getElementById('title').value;
        const desc = document.getElementById('desc').value;
        try{
          await addDoc(collection(db,'courses'), { title, description: desc, createdAt: new Date().toISOString() });
          msg.textContent = 'Curso creado';
        }catch(err){ msg.textContent = 'Error: '+err.message }
      });
    }

    window.addEventListener('firebase-ready', init);
  </script>
</body>
</html>
