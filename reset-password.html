    <title>Restablecer Contraseña | Charlotte</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase Environment Variables -->

    <style>
        body { background: linear-gradient(135deg, var(--accent-2), var(--accent)); min-height: 100vh; }
        .reset-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reset-card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 400px; width: 100%; }
        .reset-header { text-align: center; margin-bottom: 30px; }
        .reset-header img { width: 80px; margin-bottom: 15px; }
        .reset-header h1 { font-size: 24px; color: #0a1628; margin: 0; }
        .reset-header p { color: #64748b; margin-top: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #0a1628; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e8f0fe; border-radius: 8px; font-size: 15px; transition: border 0.3s; }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        .btn-reset { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-reset:hover { background: #d32f5f; transform: translateY(-2px); }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .message.error { background: #fee; color: #c00; border: 1px solid #fcc; }
        .message.success { background: #efe; color: #0a0; border: 1px solid #cfc; }
        .back-link { color: var(--accent); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <img src="Mesa de trabajo 3.png" alt="Charlotte">
                <h1>Restablecer Contraseña</h1>
                <p>Ingresa tu correo electrónico para recibir el enlace de restablecimiento.</p>
            </div>
            <div id="message" class="message"></div>
            <form id="resetForm">
                <div class="form-group">
                    <label for="reset-email">Correo Electrónico</label>
                    <input type="email" id="reset-email" required placeholder="tu@email.com">
                </div>
                <button type="submit" class="btn-reset">Enviar enlace</button>
            </form>
            <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al login</a>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        import { getAuth, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        
        const firebaseConfig = window.FIREBASE_CONFIG;
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const resetForm = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = resetForm.querySelector('.btn-reset');
        
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }
        
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value.trim();
            
            if (!email) {
                showMessage('Por favor ingresa tu correo electrónico', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
            
            try {
                // Buscar usuario en Firestore
                const q = query(collection(db, 'users'), where('email', '==', email), where('status', '==', 'approved'));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    // También buscar en pendingStudents
                    const q2 = query(collection(db, 'pendingStudents'), where('email', '==', email));
                    const snapshot2 = await getDocs(q2);
                    
                    if (snapshot2.empty) {
                        showMessage('Usuario no encontrado. Contacta al administrador.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'Enviar enlace';
                        return;
                    } else {
                        showMessage('Tu cuenta aún está en proceso de aprobación. Contacta al administrador.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'Enviar enlace';
                        return;
                    }
                }
                
                const userData = snapshot.docs[0].data();
                
                // Verificar si el usuario tiene Firebase Auth
                if (userData.authMethod === 'firebase') {
                    // Usuario con Firebase Auth - enviar email de recuperación
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
                    
                    await sendPasswordResetEmail(auth, email);
                    showMessage('Enlace de recuperación enviado. Revisa tu correo electrónico (incluye bandeja de spam).', 'success');
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = 'Enviado';
                } else {
                    // Usuario con sistema antiguo - necesita contactar al admin
                    showMessage('Tu cuenta fue creada con el sistema anterior. Por favor contacta al administrador para restablecer tu contraseña.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Enviar enlace';
                }
            } catch (error) {
                console.error('Error:', error);
                
                if (error.code === 'auth/invalid-email') {
                    showMessage('El correo electrónico no es válido.', 'error');
                } else if (error.code === 'auth/user-not-found') {
                    showMessage('Usuario no encontrado. Contacta al administrador.', 'error');
                } else {
                    showMessage('Error al procesar la solicitud. Intenta de nuevo.', 'error');
                }
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Enviar enlace';
            }
        });
    </script>
</body>
</html>
