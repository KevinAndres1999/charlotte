<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>
<body>
    <h1>Firebase Connection Test</h1>
    <div id="status">Testing connection...</div>
    <div id="auth-status">Checking auth...</div>
    <button onclick="testFirestore()">Test Firestore</button>
    <div id="firestore-result"></div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC5QpmTOMpI36qczNrQmicpMmnQC8PZCe8",
            authDomain: "charlotte-a0d47.firebaseapp.com",
            projectId: "charlotte-a0d47",
            storageBucket: "charlotte-a0d47.firebasestorage.app",
            messagingSenderId: "971007838036",
            appId: "1:971007838036:web:381b5c516ba841fef12ac1"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        document.getElementById('status').textContent = 'Firebase initialized successfully';

        // Check auth state
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-status').textContent = `Authenticated as: ${user.email}`;
            } else {
                document.getElementById('auth-status').textContent = 'Not authenticated';
            }
        });

        async function testFirestore() {
            try {
                const testCollection = db.collection('test');
                const snapshot = await testCollection.get();
                document.getElementById('firestore-result').textContent = `Firestore working! Documents in test collection: ${snapshot.size}`;
            } catch (error) {
                document.getElementById('firestore-result').textContent = `Firestore error: ${error.message}`;
                console.error('Firestore error:', error);
            }
        }

        // Auto test on load
        setTimeout(testFirestore, 1000);
    </script>
</body>
</html>
