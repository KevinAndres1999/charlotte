name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install firebase-tools
        run: npm ci && npm install -g firebase-tools
      - name: Decode service account
        env:
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          if [ -z "$FIREBASE_SA_B64" ]; then echo "Missing secret FIREBASE_SERVICE_ACCOUNT_B64"; exit 1; fi
          echo "$FIREBASE_SA_B64" | base64 --decode > ./sa.json
      - name: Authenticate firebase
        run: firebase login:ci --no-localhost || true
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          firebase deploy --only firestore:rules --project charlotte-a0d47
