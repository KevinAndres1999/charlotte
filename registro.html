<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Permissions-Policy" content="accelerometer=(), gyroscope=(), magnetometer=(), microphone=(), camera=(), speaker=(), usb=(), bluetooth=(), geolocation=(), payment=(), interest-cohort=(), autoplay=(), encrypted-media=(), fullscreen=(), picture-in-picture=(), sync-xhr=(), cross-origin-isolated=(), disabled-depth=(), disabled-width=(), disabled-height=(), unload=(), browsing-topics=()" />
    <title>Registro de Estudiantes | Charlotte</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase Environment Variables -->
    <script>
        // Firebase configuration - values will be replaced by Netlify during build
        window.FIREBASE_CONFIG = {
            apiKey: "AIzaSyC5QpmTOMpI36qczNrQmicpMmnQC8PZCe8",
            authDomain: "charlotte-a0d47.firebaseapp.com",
            projectId: "charlotte-a0d47",
            storageBucket: "charlotte-a0d47.firebasestorage.app",
            messagingSenderId: "971007838036",
            appId: "1:971007838036:web:381b5c516ba841fef12ac1"
        };
    </script>
    <style>
        :root {
            --bg: #fef5f9;
            --card: #ffffff;
            --muted: #6b7a90;
            --accent: #e63971;
            --accent-2: #0b3460;
            --danger: #d9534f;
            --success: #28a745;
            --radius: 12px;
            --shadow-sm: 0 6px 18px rgba(230,57,113,0.06);
            --shadow-md: 0 12px 34px rgba(230,57,113,0.08);
            --container: 1100px;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            padding: 20px;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header img {
            width: 80px;
            margin-bottom: 15px;
        }
        .login-header h1 {
            font-size: 24px;
            color: #0a1628;
            margin: 0;
        }
        .login-header p {
            color: #64748b;
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0a1628;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8f0fe;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-register:hover {
            background: #d32f5f;
            transform: translateY(-2px);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e8f0fe;
        }
        .login-footer p {
            color: #64748b;
            margin-bottom: 10px;
        }
        .login-footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .message.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }
        .message.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover {
            opacity: 0.8;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-header h1 {
                font-size: 20px;
            }
            .back-link {
                position: static;
                display: inline-flex;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="login.html" class="back-link" aria-label="Volver a la página de inicio de sesión">
        <i class="fas fa-arrow-left"></i> Volver a login
    </a>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="Mesa de trabajo 3.png" alt="Logo de Charlotte - Academia de Belleza y Panadería" aria-label="Logo de Charlotte">
                <h1>Registro de Estudiante</h1>
                <p>Completa el formulario para solicitar acceso</p>
            </div>

            <div id="message" class="message" role="alert" aria-live="polite"></div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Nombre Completo *</label>
                    <input type="text" id="name" required placeholder="Tu nombre completo" aria-required="true">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email" aria-required="true">
                </div>
                <div class="form-group">
                    <label for="cedula">Cédula *</label>
                    <input type="text" id="cedula" required placeholder="1234567890" pattern="[0-9]{10}" title="Ingresa 10 dígitos numéricos" aria-required="true">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono *</label>
                    <input type="tel" id="telefono" required placeholder="0999999999" pattern="[0-9]{10}" title="Ingresa 10 dígitos numéricos" aria-required="true">
                </div>
                <div class="form-group">
                    <label for="programa">Programa de Estudio *</label>
                    <select id="programa" required aria-required="true">
                        <option value="">Selecciona un programa</option>
                        <option value="Belleza Integral">Belleza Integral</option>
                        <option value="Panadería y Pastelería">Panadería y Pastelería</option>
                        <option value="Asesoría Técnica">Asesoría Técnica</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sede">Sede *</label>
                    <select id="sede" required aria-required="true">
                        <option value="">Selecciona una sede</option>
                        <option value="Carapungo">Carapungo</option>
                        <option value="Sangolquí">Sangolquí</option>
                        <option value="Saquisilí">Saquisilí</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" aria-required="true">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña *</label>
                    <input type="password" id="confirmPassword" required placeholder="Repite tu contraseña" autocomplete="new-password" aria-required="true">
                </div>
                <button type="submit" class="btn-register" aria-describedby="message">Enviar Solicitud</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes cuenta?</p>
                <a href="login.html">Iniciar Sesión</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, addDoc, query, where, getDocs, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

        const firebaseConfig = window.FIREBASE_CONFIG;

        let app, db, auth;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            console.log('✅ Firebase initialized successfully');
        } catch (error) {
            console.error('❌ Firebase initialization error:', error);
            // Si hay error en inicialización, intentar reinicializar sin persistencia
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                console.log('✅ Firebase re-initialized');
            } catch (retryError) {
                console.error('❌ Firebase re-initialization also failed:', retryError);
                alert('Error al conectar con el servidor. Por favor recarga la página.');
            }
        }

        const registerForm = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value;
            const submitBtn = registerForm.querySelector('.btn-register');

            if (password !== confirmPassword) {
                showMessage('Las contraseñas no coinciden', 'error');
                return;
            }

            // Validar contraseña
            if (password.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creando cuenta...';

            try {
                // Verificar si el email ya existe en usuarios
                const q = query(collection(db, 'users'), where('email', '==', email));
                const snapshot = await getDocs(q);
                
                if (!snapshot.empty) {
                    showMessage('Este correo ya está registrado. Por favor inicia sesión.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Enviar Solicitud';
                    return;
                }

                const studentData = {
                    name: document.getElementById('name').value,
                    email: email,
                    cedula: document.getElementById('cedula').value,
                    telefono: document.getElementById('telefono').value,
                    programa: document.getElementById('programa').value,
                    sede: document.getElementById('sede').value,
                    password: password,
                    status: 'pending',
                    registeredDate: new Date().toISOString()
                };

                console.log('Enviando datos a Firestore:', studentData);
                
                // Usar Firebase Auth para crear usuario (seguro)
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const firebaseUID = userCredential.user.uid;
                
                // Guardar datos del usuario en Firestore con referencia al UID de Firebase
                const userDoc = {
                    firebaseUID: firebaseUID, // Referencia segura a Firebase Auth
                    name: document.getElementById('name').value,
                    email: email,
                    cedula: document.getElementById('cedula').value,
                    telefono: document.getElementById('telefono').value,
                    programa: document.getElementById('programa').value,
                    sede: document.getElementById('sede').value,
                    role: 'student', // Definir rol por defecto
                    // NO guardamos la contraseña - Firebase Auth la maneja de forma segura
                    // Marcamos como usuario nuevo con autenticación segura
                    authMethod: 'firebase', // Nuevo sistema de autenticación
                    status: 'pending',
                    registeredDate: new Date().toISOString()
                };
                
                // Guardar en colección users con el UID de Firebase como ID del documento
                await setDoc(doc(db, 'users', firebaseUID), userDoc);
                
                // También guardar en pendingStudents para que aparezca en la lista del admin
                const pendingDoc = {
                    ...userDoc,
                    id: firebaseUID, // ID para compatibilidad
                    email: email
                };
                await setDoc(doc(db, 'pendingStudents', firebaseUID), pendingDoc);
                
                console.log('Usuario creado con Firebase Auth - UID:', firebaseUID);
                showMessage('¡Cuenta creada exitosamente! Espera la aprobación del administrador.', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                console.error('Error:', error);
                let errorMessage = 'Error al registrar. Intenta de nuevo.';
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Este correo ya está registrado. Por favor inicia sesión.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'El correo electrónico no es válido.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'La contraseña debe tener al menos 6 caracteres.';
                }
                
                showMessage(errorMessage, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Enviar Solicitud';
            }
        });
    </script>
</body>
</html>
