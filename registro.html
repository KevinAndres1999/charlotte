<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro | Charlotte</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .container{max-width:720px;margin:40px auto;padding:20px}
    .message{padding:10px;border-radius:6px;display:none}
    .error{background:#fdecea;color:#b71c1c}
    .success{background:#e6f4ea;color:#0b6623}
  </style>
</head>
<body>
    <div class="container">
        <h1>Registro de Usuarios</h1>
        <p>Regístrate como estudiante o docente. Los estudiantes requieren aprobación del docente.</p>

        <div id="message" class="message"></div>

        <form id="registerForm">
            <label>Nombre completo</label>
            <input id="name" required />
            <label>Correo</label>
            <input id="email" type="email" required />
            <label>Contraseña</label>
            <input id="password" type="password" minlength="6" required />
            <label>Registro como</label>
            <select id="role">
                <option value="student">Estudiante</option>
                <option value="teacher">Docente</option>
            </select>
            <div id="teacherKeyGroup" style="display:none">
                <label>Clave docente</label>
                <input id="teacherKey" type="password" />
            </div>
            <button type="submit">Registrar</button>
        </form>

        <p>¿Ya tienes cuenta? <a href="login.html">Entrar</a></p>
    </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCBpoxr8yhAfCVqP00b6DKtMA0JWljlMMA",
      authDomain: "charlotte-babda.firebaseapp.com",
      projectId: "charlotte-babda",
      storageBucket: "charlotte-babda.firebasestorage.app",
      messagingSenderId: "486360806502",
      appId: "1:486360806502:web:d82fb7f351b8fe4587a9a7"
    };

    const TEACHER_KEY = 'charlotte2025';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const roleEl = document.getElementById('role');
    const teacherKeyGroup = document.getElementById('teacherKeyGroup');
    roleEl.addEventListener('change', ()=>{ teacherKeyGroup.style.display = roleEl.value==='teacher' ? 'block' : 'none'; });

    const msg = document.getElementById('message');
    function show(type, text){ msg.className='message '+(type==='error'?'error':'success'); msg.textContent = text; msg.style.display='block'; }

    document.getElementById('registerForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      msg.style.display='none';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      if(role==='teacher'){
        const key = document.getElementById('teacherKey').value||'';
        if(key !== TEACHER_KEY){ show('error','Clave docente incorrecta'); return; }
      }
      try{
        const cred = await createUserWithEmailAndPassword(auth,email,password);
        // ensure token available
        await cred.user.getIdToken(true).catch(()=>{});
        const uid = cred.user.uid;
        const userDoc = {
          uid, name, email, role: role, status: role==='teacher'?'approved':'pending', createdAt: new Date().toISOString()
        };
        await setDoc(doc(db,'users',uid), userDoc);
        show('success', role==='teacher' ? 'Docente creado y aprobado. Puedes ingresar.' : 'Solicitud enviada. Espera aprobación.');
        setTimeout(()=>location.href='login.html',1500);
      }catch(err){
        console.error(err);
        if(err && err.code==='auth/email-already-in-use') show('error','El correo ya está registrado.'); else show('error',err.message||'Error al registrar');
      }
    });
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes | Charlotte</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            padding: 20px;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header img {
            width: 80px;
            margin-bottom: 15px;
        }
        .login-header h1 {
            font-size: 24px;
            color: #0a1628;
            margin: 0;
        }
        .login-header p {
            color: #64748b;
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0a1628;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8f0fe;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-register:hover {
            background: #d32f5f;
            transform: translateY(-2px);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e8f0fe;
        }
        .login-footer p {
            color: #64748b;
            margin-bottom: 10px;
        }
        .login-footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .message.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }
        .message.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover {
            opacity: 0.8;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-header h1 {
                font-size: 20px;
            }
            .back-link {
                position: static;
                display: inline-flex;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="login.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver a login
    </a>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="Mesa de trabajo 3.png" alt="Charlotte">
                <h1>Registro de Estudiante</h1>
                <p>Completa el formulario para solicitar acceso</p>
            </div>

            <div id="message" class="message"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nombre Completo *</label>
                    <input type="text" id="name" required placeholder="Tu nombre completo">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="cedula">Cédula *</label>
                    <input type="text" id="cedula" required placeholder="1234567890">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono *</label>
                    <input type="tel" id="telefono" required placeholder="0999999999">
                </div>
                <div class="form-group">
                    <label for="programa">Programa de Estudio *</label>
                    <select id="programa" required>
                        <option value="">Selecciona un programa</option>
                        <option value="Belleza y Cosmetología">Belleza y Cosmetología</option>
                        <option value="Panadería y Pastelería">Panadería y Pastelería</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sede">Sede *</label>
                    <select id="sede" required>
                        <option value="">Selecciona una sede</option>
                        <option value="Carapungo">Carapungo</option>
                        <option value="Sangolquí">Sangolquí</option>
                        <option value="Saquisilí">Saquisilí</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="role">Registro Como *</label>
                    <select id="role" required>
                        <option value="student">Estudiante</option>
                        <option value="teacher">Docente</option>
                    </select>
                </div>
                <div class="form-group" id="teacherKeyGroup" style="display:none;">
                    <label for="teacherKey">Clave Docente</label>
                    <input type="password" id="teacherKey" placeholder="Clave para registro de docentes">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña *</label>
                    <input type="password" id="confirmPassword" required placeholder="Repite tu contraseña">
                </div>
                <button type="submit" class="btn-register">Enviar Solicitud</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes cuenta?</p>
                <a href="login.html">Iniciar Sesión</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import { getFirestore, doc, setDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCBpoxr8yhAfCVqP00b6DKtMA0JWljlMMA",
            authDomain: "charlotte-babda.firebaseapp.com",
            projectId: "charlotte-babda",
            storageBucket: "charlotte-babda.firebasestorage.app",
            messagingSenderId: "486360806502",
            appId: "1:486360806502:web:d82fb7f351b8fe4587a9a7"
        };

        const TEACHER_KEY = 'charlotte2025';
        const ADMIN_EMAIL = 'nuestrareceta.ec@gmail.com';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const registerForm = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');
        const roleSelect = document.getElementById('role');
        const teacherKeyGroup = document.getElementById('teacherKeyGroup');

        roleSelect.addEventListener('change', () => {
            if (roleSelect.value === 'teacher') teacherKeyGroup.style.display = 'block'; else teacherKeyGroup.style.display = 'none';
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        async function triggerPasswordReset(email) {
            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('Se ha enviado un correo para restablecer la contraseña. Revisa tu bandeja.', 'success');
            } catch (e) {
                console.error('Reset password error', e);
                showMessage('No se pudo enviar el correo de restablecimiento. Intenta desde login.', 'error');
            }
        }

        async function callSendEmail(payload) {
            try {
                await fetch('/.netlify/functions/sendEmail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { console.warn('sendEmail failed', e); }
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Las contraseñas no coinciden', 'error');
                return;
            }

            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;

            if (role === 'teacher') {
                const key = document.getElementById('teacherKey').value || '';
                if (key.trim() !== TEACHER_KEY) {
                    showMessage('Clave docente incorrecta', 'error');
                    return;
                }
            }

            try {
                // Crear usuario con Firebase Auth en cliente
                const userCred = await createUserWithEmailAndPassword(auth, email, password);

                // Esperar a que el usuario esté autenticado y tenga token
                await new Promise((resolve) => {
                    const unsub = auth.onAuthStateChanged(async (u) => {
                        if (u && u.uid === userCred.user.uid) {
                            try { await u.getIdToken(true); } catch (e) { console.warn('getIdToken warning', e); }
                            unsub();
                            resolve();
                        }
                    });
                });

                const uid = userCred.user.uid;

                const userData = {
                    uid,
                    name: document.getElementById('name').value,
                    email,
                    cedula: document.getElementById('cedula').value,
                    telefono: document.getElementById('telefono').value,
                    programa: document.getElementById('programa').value,
                    sede: document.getElementById('sede').value,
                    role: role === 'teacher' ? 'teacher' : 'student',
                    status: role === 'teacher' ? 'approved' : 'pending',
                    registeredDate: new Date().toISOString()
                };

                // Escritura directa desde cliente — las reglas permiten crear si request.auth != null
                await setDoc(doc(db, 'users', uid), userData);

                // Notificaciones
                const adminPayload = {
                    to: [ADMIN_EMAIL],
                    subject: `Nuevo registro: ${userData.name}`,
                    text: `Se ha registrado un nuevo usuario (${userData.role}).\nNombre: ${userData.name}\nEmail: ${userData.email}\nPrograma: ${userData.programa}\nSede: ${userData.sede}`
                };
                callSendEmail(adminPayload);

                const userPayload = {
                    to: [userData.email],
                    subject: `Confirmación de registro`,
                    text: role === 'teacher' ? `Tu cuenta como docente ha sido creada y aprobada.` : `Tu solicitud ha sido enviada y está pendiente de aprobación.`
                };
                callSendEmail(userPayload);

                showMessage(role === 'teacher' ? 'Docente registrado y aprobado' : '¡Solicitud enviada! Espera la aprobación del administrador.', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);

            } catch (error) {
                console.error('Error:', error);
                // Manejo específico para email ya en uso
                if (error && error.code === 'auth/email-already-in-use') {
                    // Mostrar mensaje con opción de restablecer contraseña
                    messageDiv.innerHTML = `El correo ya está registrado. <a href="login.html">Ir a iniciar sesión</a> o <button id="resetBtn" class="btn-register">Restablecer contraseña</button>`;
                    messageDiv.className = 'message error';
                    messageDiv.style.display = 'block';
                    const resetBtn = document.getElementById('resetBtn');
                    if (resetBtn) resetBtn.addEventListener('click', () => triggerPasswordReset(email));
                } else {
                    const errMsg = (error && error.message) ? error.message : 'Error al registrar. Intenta de nuevo.';
                    showMessage(errMsg, 'error');
                }
            }
        });
    </script>
</body>
</html>
